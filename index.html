<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YoulanChat</title>
<style>
:root {
  --bg-app: #eae6df; --bg-sidebar: #ffffff; --bg-header-light: #f0f2f5; --bg-header-dark: #008069;
  --bg-chat: #efeae2; --bg-bubble-out: #d9fdd3; --bg-bubble-in: #ffffff; --bg-composer: #f0f2f5;
  --bg-input: #ffffff; --bg-hover: #f5f6f6; --bg-search: #f0f2f5; --bg-active: #f0f2f5;
  --text-primary: #111b21; --text-secondary: #667781; --text-header: #111b21; --text-header-dark: #ffffff;
  --border: #e9edef; --green: #00a884; --green-dark: #008069; --blue-check: #53bdeb; --red: #ea4335;
  --shadow-sm: 0 1px 0.5px rgba(11,20,26,.13); --shadow-md: 0 2px 5px rgba(11,20,26,.1);
  --chat-pattern: url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="%23efeae2"/><path d="M30 30 l10 10 M40 30 l-10 10 M100 80 l15 -15 M80 150 l20 20 M200 100 l10 10 M250 200 l15 -15 M150 250 l10 10" stroke="%23d1cbc1" fill="none" stroke-width="1" opacity="0.4"/></svg>');
}
[data-theme="dark"] {
  --bg-app: #0a1014; --bg-sidebar: #111b21; --bg-header-light: #202c33; --bg-header-dark: #202c33;
  --bg-chat: #0b141a; --bg-bubble-out: #005c4b; --bg-bubble-in: #202c33; --bg-composer: #202c33;
  --bg-input: #2a3942; --bg-hover: #202c33; --bg-search: #202c33; --bg-active: #2a3942;
  --text-primary: #e9edef; --text-secondary: #8696a0; --text-header: #e9edef; --text-header-dark: #e9edef;
  --border: #222d34; --shadow-sm: 0 1px 0.5px rgba(0,0,0,.5); --shadow-md: 0 2px 5px rgba(0,0,0,.5);
  --chat-pattern: url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="%230b141a"/><path d="M30 30 l10 10 M40 30 l-10 10 M100 80 l15 -15 M80 150 l20 20 M200 100 l10 10 M250 200 l15 -15 M150 250 l10 10" stroke="%231f2c33" fill="none" stroke-width="1" opacity="0.6"/></svg>');
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
body { background: var(--bg-app); color: var(--text-primary); }
#app { height: 100%; display: flex; position: relative; overflow: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(11, 20, 26, 0.2); border-radius: 3px; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(233, 237, 239, 0.2); }

.icon { width: 24px; height: 24px; fill: currentColor; display: inline-block; vertical-align: middle; }

/* WELCOME */
.welcome-screen { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg-app); padding: 20px; z-index: 10; overflow-y: auto; }
.welcome-card { background: var(--bg-sidebar); border-radius: 8px; padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md); text-align: center; margin: auto; }
.welcome-logo { width: 80px; height: 80px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
.welcome-logo svg { width: 45px; height: 45px; fill: #fff; }
.welcome-card h1 { font-size: 26px; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; }
.welcome-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
.input-group { text-align: left; margin-bottom: 24px; }
.input-group label { display: block; font-size: 12px; color: var(--green-dark); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
[data-theme="dark"] .input-group label { color: var(--green); }
.input-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-sidebar); color: var(--text-primary); font-size: 15px; outline: none; transition: border 0.2s; }
.input-group input:focus { border-color: var(--green); }
.btn-primary { width: 100%; padding: 14px; background: var(--green-dark); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--green); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.existing { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.existing h3 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.btn-secondary { width: 100%; padding: 12px; background: var(--bg-app); border: none; color: var(--text-primary); border-radius: 8px; margin-bottom: 8px; font-weight: 500; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;}
.btn-secondary:hover { background: var(--border); }
.btn-clear { background: transparent; color: var(--red); border: 1px solid var(--red); margin-top: 12px; font-size: 13px; padding: 8px; }
.btn-clear:hover { background: rgba(234, 67, 53, 0.1); }

/* SIDEBAR */
.sidebar { width: 380px; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
.sidebar-header { background: var(--bg-header-light); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 59px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; color: #667781; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; flex-shrink: 0; text-transform: uppercase; overflow: hidden; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-header .avatar { width: 40px; height: 40px; }
.sidebar-header .info { flex: 1; }
.sidebar-header .info .name { font-weight: 600; font-size: 16px; color: var(--text-header); display: flex; align-items: center; gap: 6px; }
.sidebar-header .actions { display: flex; gap: 8px; color: var(--text-secondary); }
.sidebar-header .actions button { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.sidebar-header .actions button:hover { background: rgba(0,0,0,0.05); }
[data-theme="dark"] .sidebar-header .actions button:hover { background: rgba(255,255,255,0.05); }

/* TICK BADGES */
.tick-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; vertical-align: middle; }
.tick-badge svg { display: block; }
.tick-badge.grey svg { width: 15px; height: 15px; }
.tick-badge.blue svg { width: 16px; height: 16px; }
.tick-badge.red svg { width: 16px; height: 16px; }

.search-container { padding: 8px 12px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
.search-box { display: flex; align-items: center; background: var(--bg-search); border-radius: 8px; padding: 0 12px; height: 36px; }
.search-box svg { width: 18px; height: 18px; fill: var(--text-secondary); margin-right: 10px; }
.search-box input { flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 14px; outline: none; }

.chat-list { flex: 1; overflow-y: auto; background: var(--bg-sidebar); }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background 0.1s; }
.chat-item:hover { background: var(--bg-hover); }
.chat-item.active { background: var(--bg-active); }
.avatar-wrap { position: relative; }
.online-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg-sidebar); }
.chat-item .body { flex: 1; min-width: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-top: 12px; margin-bottom: -12px; }
.chat-item:last-child .body { border-bottom: none; }
.chat-item .row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.chat-item .name { font-weight: 400; color: var(--text-primary); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.chat-item .time { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.chat-item .row-bottom { display: flex; justify-content: space-between; align-items: center; }
.chat-item .preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item .unread { background: var(--green); color: var(--bg-sidebar); font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; padding: 0 6px; margin-left: 8px; }
[data-theme="dark"] .chat-item .unread { color: #111b21; }

/* MAIN CHAT */
.main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); background-image: var(--chat-pattern); position: relative; border-left: 1px solid var(--border); }
.chat-header { background: var(--bg-header-light); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 59px; z-index: 5; border-bottom: 1px solid var(--border); }
.chat-header .back { display: none; background: none; border: none; color: var(--text-header); cursor: pointer; padding: 4px; margin-right: 4px; }
.chat-header .info { flex: 1; min-width: 0; }
.chat-header .info .name { font-weight: 400; font-size: 16px; color: var(--text-header); display: flex; align-items: center; gap: 4px; }
.chat-header .info .status { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.chat-header .actions { display: flex; gap: 8px; color: var(--text-secondary); }
.chat-header .actions button { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.chat-header .actions button:hover { background: rgba(0,0,0,0.05); }
[data-theme="dark"] .chat-header .actions button:hover { background: rgba(255,255,255,0.05); }

.messages-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.messages { flex: 1; overflow-y: auto; padding: 20px 6%; display: flex; flex-direction: column; }

.date-sep { text-align: center; margin: 12px 0; position: sticky; top: 0; z-index: 2; }
.date-sep span { background: var(--bg-bubble-in); color: var(--text-secondary); font-size: 12px; padding: 6px 12px; border-radius: 8px; box-shadow: var(--shadow-sm); text-transform: uppercase; font-weight: 500; }

/* BUBBLES */
.bubble { max-width: 65%; padding: 6px 7px 8px 9px; border-radius: 7.5px; position: relative; box-shadow: var(--shadow-sm); color: var(--text-primary); margin-bottom: 8px; }
.bubble.bubble-new { animation: popIn 0.2s cubic-bezier(0.1, 0.82, 0.25, 1); }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.bubble.mine { background: var(--bg-bubble-out); align-self: flex-end; border-top-right-radius: 0; }
.bubble.theirs { background: var(--bg-bubble-in); align-self: flex-start; border-top-left-radius: 0; }
.bubble.mine::before { content: ''; position: absolute; top: 0; right: -8px; width: 8px; height: 13px; background: var(--bg-bubble-out); clip-path: polygon(0 0, 0% 100%, 100% 0); }
.bubble.theirs::before { content: ''; position: absolute; top: 0; left: -8px; width: 8px; height: 13px; background: var(--bg-bubble-in); clip-path: polygon(100% 0, 100% 100%, 0 0); }
.bubble .text { font-size: 14.2px; line-height: 19px; white-space: pre-wrap; word-break: break-word; padding-right: 60px; margin-bottom: 2px; }
.bubble .meta { font-size: 11px; color: var(--text-secondary); position: absolute; bottom: 4px; right: 7px; display: flex; align-items: center; gap: 3px; float: right; }
.bubble .meta svg { width: 16px; height: 15px; }

.msg-menu-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.08); border: none; border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); z-index: 5; transition: background 0.2s; }
[data-theme="dark"] .msg-menu-btn { background: rgba(255,255,255,0.15); }
.msg-menu-btn svg { width: 16px; height: 16px; }
.bubble:hover .msg-menu-btn { display: flex; }
@media (max-width: 768px) { .msg-menu-btn { display: flex; opacity: 0.6; } }

.reply-quote { font-size: 13px; color: var(--text-secondary); border-left: 4px solid var(--green); padding: 4px 8px; margin-bottom: 6px; background: rgba(0,0,0,0.04); border-radius: 4px; display: flex; flex-direction: column; }
[data-theme="dark"] .reply-quote { background: rgba(255,255,255,0.04); }
.reply-quote strong { color: var(--green); font-size: 12px; margin-bottom: 2px; }

.forwarded-label { font-size: 12px; font-style: italic; color: var(--text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

.call-log { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); padding: 4px; }
.call-log svg { width: 18px; height: 18px; fill: var(--text-secondary); }
.call-log.missed { color: var(--red); }
.call-log.missed svg { fill: var(--red); }

.bubble .img { max-width: 100%; max-height: 300px; border-radius: 6px; display: block; margin-bottom: 4px; cursor: pointer; object-fit: cover; }
.bubble .file { display: flex; gap: 12px; align-items: center; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 6px; color: var(--text-primary); text-decoration: none; margin-bottom: 4px; padding-right: 60px;}
[data-theme="dark"] .bubble .file { background: rgba(255,255,255,0.05); }
.bubble .file-name { font-size: 14px; font-weight: 500; word-break: break-all; }
.bubble .file-size { font-size: 12px; color: var(--text-secondary); }

.voice-note { display: flex; align-items: center; gap: 10px; min-width: 240px; padding: 4px 0; padding-right: 55px;}
.vn-play { background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; }
.vn-play svg { width: 20px; height: 20px; fill: currentColor; }
.vn-waveform { flex: 1; display: flex; align-items: center; height: 24px; gap: 2px; cursor: pointer; position: relative; }
.vn-bar { flex: 1; background: var(--text-secondary); height: 4px; border-radius: 2px; transition: height 0.1s; }
.vn-bar.played { background: var(--green); }
.vn-duration { font-size: 11px; color: var(--text-secondary); min-width: 30px; text-align: right; }
.vn-speed { background: rgba(0,0,0,0.1); border: none; border-radius: 10px; padding: 2px 6px; font-size: 11px; color: var(--text-primary); cursor: pointer; font-weight: 600; }
[data-theme="dark"] .vn-speed { background: rgba(255,255,255,0.1); }

.reaction-badge { position: absolute; bottom: -12px; right: 10px; background: var(--bg-bubble-in); border-radius: 12px; padding: 2px 6px; font-size: 14px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); z-index: 2; }
.bubble.mine .reaction-badge { background: var(--bg-bubble-in); }

/* COMPOSER */
.composer { background: var(--bg-composer); padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; z-index: 5; min-height: 62px; }
.composer .icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
.composer .icon-btn:hover { color: var(--text-primary); }
.composer .input-wrap { flex: 1; background: var(--bg-input); border-radius: 8px; display: flex; align-items: center; padding: 9px 12px; min-height: 42px; }
.composer textarea { flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 15px; resize: none; outline: none; max-height: 100px; min-height: 24px; line-height: 20px; font-family: inherit; padding: 0; }
.composer .send-btn { background: var(--green-dark); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s, background 0.2s; }
.composer .send-btn:active { transform: scale(0.92); }
.composer .send-btn:hover { background: var(--green); }

.composer-reply { background: var(--bg-composer); padding: 8px 16px 0; display: flex; align-items: center; gap: 12px; }
.composer-reply .bar { width: 4px; height: 35px; background: var(--green); border-radius: 2px; }
.composer-reply .info { flex: 1; overflow: hidden; }
.composer-reply .info strong { display: block; font-size: 13px; color: var(--green); }
.composer-reply .info span { display: block; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer-reply .close { background: none; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; padding: 4px; }

.recording-bar { background: var(--bg-composer); padding: 10px 16px; display: flex; align-items: center; gap: 12px; z-index: 5; min-height: 62px; }
.recording-bar .dot { width: 12px; height: 12px; background: var(--red); border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.recording-bar .timer { font-size: 16px; font-weight: 500; color: var(--red); flex: 1; }
.recording-bar button { padding: 8px 16px; border-radius: 20px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
.recording-bar .btn-cancel { background: var(--bg-sidebar); color: var(--red); border: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
.recording-bar .btn-send { background: var(--green-dark); color: #fff; display: flex; align-items: center; gap: 4px; }

.typing-indicator { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: var(--bg-bubble-in); border-radius: 8px; width: fit-content; box-shadow: var(--shadow-sm); margin-top: 4px; }
.typing-dot { width: 6px; height: 6px; background: var(--text-secondary); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

/* MODALS */
.modal-bg { position: fixed; inset: 0; background: rgba(11,20,26,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(2px); animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg-sidebar); border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md); animation: slideUp 0.2s; max-height: 88vh; overflow-y: auto; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h2 { font-size: 20px; color: var(--text-primary); margin-bottom: 16px; font-weight: 500; }
.modal input, .modal textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-app); color: var(--text-primary); font-size: 15px; outline: none; margin-bottom: 16px; font-family: inherit; resize: vertical; }
.modal textarea { min-height: 70px; }
.modal button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
.modal .menu-item { display: block; width: 100%; text-align: left; padding: 14px; font-size: 15px; color: var(--text-primary); background: none; border-radius: 8px; margin-bottom: 4px; font-weight: 400; }
.modal .menu-item:hover { background: var(--bg-hover); }

.emoji-bar { display: flex; gap: 8px; background:
