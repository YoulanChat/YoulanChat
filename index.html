<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YoulanChat</title>
<style>
:root {
  --bg-app: #eae6df; --bg-sidebar: #ffffff; --bg-header-light: #f0f2f5; --bg-header-dark: #008069;
  --bg-chat: #efeae2; --bg-bubble-out: #d9fdd3; --bg-bubble-in: #ffffff; --bg-composer: #f0f2f5;
  --bg-input: #ffffff; --bg-hover: #f5f6f6; --bg-search: #f0f2f5; --bg-active: #f0f2f5;
  --text-primary: #111b21; --text-secondary: #667781; --text-header: #111b21; --text-header-dark: #ffffff;
  --border: #e9edef; --green: #00a884; --green-dark: #008069; --blue-check: #53bdeb; --red: #ea4335;
  --shadow-sm: 0 1px 0.5px rgba(11,20,26,.13); --shadow-md: 0 2px 5px rgba(11,20,26,.1);
  --chat-pattern: url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="%23efeae2"/><path d="M30 30 l10 10 M40 30 l-10 10 M100 80 l15 -15 M80 150 l20 20 M200 100 l10 10 M250 200 l15 -15 M150 250 l10 10" stroke="%23d1cbc1" fill="none" stroke-width="1" opacity="0.4"/></svg>');
}
[data-theme="dark"] {
  --bg-app: #0a1014; --bg-sidebar: #111b21; --bg-header-light: #202c33; --bg-header-dark: #202c33;
  --bg-chat: #0b141a; --bg-bubble-out: #005c4b; --bg-bubble-in: #202c33; --bg-composer: #202c33;
  --bg-input: #2a3942; --bg-hover: #202c33; --bg-search: #202c33; --bg-active: #2a3942;
  --text-primary: #e9edef; --text-secondary: #8696a0; --text-header: #e9edef; --text-header-dark: #e9edef;
  --border: #222d34; --shadow-sm: 0 1px 0.5px rgba(0,0,0,.5); --shadow-md: 0 2px 5px rgba(0,0,0,.5);
  --chat-pattern: url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="%230b141a"/><path d="M30 30 l10 10 M40 30 l-10 10 M100 80 l15 -15 M80 150 l20 20 M200 100 l10 10 M250 200 l15 -15 M150 250 l10 10" stroke="%231f2c33" fill="none" stroke-width="1" opacity="0.6"/></svg>');
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
body { background: var(--bg-app); color: var(--text-primary); }
#app { height: 100%; display: flex; position: relative; overflow: hidden; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(11, 20, 26, 0.2); border-radius: 3px; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(233, 237, 239, 0.2); }
.icon { width: 24px; height: 24px; fill: currentColor; display: inline-block; vertical-align: middle; }

.welcome-screen { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg-app); padding: 20px; z-index: 10; overflow-y: auto; }
.welcome-card { background: var(--bg-sidebar); border-radius: 8px; padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md); text-align: center; margin: auto; }
.welcome-logo { width: 80px; height: 80px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
.welcome-logo svg { width: 45px; height: 45px; fill: #fff; }
.welcome-card h1 { font-size: 26px; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; }
.welcome-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
.input-group { text-align: left; margin-bottom: 24px; }
.input-group label { display: block; font-size: 12px; color: var(--green-dark); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
[data-theme="dark"] .input-group label { color: var(--green); }
.input-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-sidebar); color: var(--text-primary); font-size: 15px; outline: none; transition: border 0.2s; }
.input-group input:focus { border-color: var(--green); }
.btn-primary { width: 100%; padding: 14px; background: var(--green-dark); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--green); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.existing { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.existing h3 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.btn-secondary { width: 100%; padding: 12px; background: var(--bg-app); border: none; color: var(--text-primary); border-radius: 8px; margin-bottom: 8px; font-weight: 500; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;}
.btn-secondary:hover { background: var(--border); }
.btn-clear { background: transparent; color: var(--red); border: 1px solid var(--red); margin-top: 12px; font-size: 13px; padding: 8px; }

.sidebar { width: 380px; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
.sidebar-header { background: var(--bg-header-light); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 59px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; color: #667781; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; flex-shrink: 0; text-transform: uppercase; overflow: hidden; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-header .avatar { width: 40px; height: 40px; cursor: pointer; }
.sidebar-header .info { flex: 1; }
.sidebar-header .info .name { font-weight: 600; font-size: 16px; color: var(--text-header); display: flex; align-items: center; gap: 6px; }
.sidebar-header .actions { display: flex; gap: 8px; color: var(--text-secondary); }
.sidebar-header .actions button { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.sidebar-header .actions button:hover { background: rgba(0,0,0,0.05); }
[data-theme="dark"] .sidebar-header .actions button:hover { background: rgba(255,255,255,0.05); }

.tick-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; vertical-align: middle; }
.tick-badge svg { display: block; }
.tick-badge.grey svg { width: 15px; height: 15px; }
.tick-badge.blue svg { width: 16px; height: 16px; }
.tick-badge.red svg { width: 16px; height: 16px; }

.search-container { padding: 8px 12px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
.search-box { display: flex; align-items: center; background: var(--bg-search); border-radius: 8px; padding: 0 12px; height: 36px; }
.search-box svg { width: 18px; height: 18px; fill: var(--text-secondary); margin-right: 10px; }
.search-box input { flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 14px; outline: none; }

.chat-list { flex: 1; overflow-y: auto; background: var(--bg-sidebar); }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background 0.1s; }
.chat-item:hover { background: var(--bg-hover); }
.chat-item.active { background: var(--bg-active); }
.avatar-wrap { position: relative; }
.online-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg-sidebar); }
.chat-item .body { flex: 1; min-width: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-top: 12px; margin-bottom: -12px; }
.chat-item:last-child .body { border-bottom: none; }
.chat-item .row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.chat-item .name { font-weight: 400; color: var(--text-primary); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.chat-item .time { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.chat-item .row-bottom { display: flex; justify-content: space-between; align-items: center; }
.chat-item .preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item .unread { background: var(--green); color: var(--bg-sidebar); font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; padding: 0 6px; margin-left: 8px; }
[data-theme="dark"] .chat-item .unread { color: #111b21; }

.main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); background-image: var(--chat-pattern); position: relative; border-left: 1px solid var(--border); }
.chat-header { background: var(--bg-header-light); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 59px; z-index: 5; border-bottom: 1px solid var(--border); }
.chat-header .back { display: none; background: none; border: none; color: var(--text-header); cursor: pointer; padding: 4px; margin-right: 4px; }
.chat-header .info { flex: 1; min-width: 0; }
.chat-header .info .name { font-weight: 400; font-size: 16px; color: var(--text-header); display: flex; align-items: center; gap: 4px; }
.chat-header .info .status { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.chat-header .actions { display: flex; gap: 8px; color: var(--text-secondary); }
.chat-header .actions button { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.chat-header .actions button:hover { background: rgba(0,0,0,0.05); }
[data-theme="dark"] .chat-header .actions button:hover { background: rgba(255,255,255,0.05); }

.messages-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.messages { flex: 1; overflow-y: auto; padding: 20px 6%; display: flex; flex-direction: column; }

.date-sep { text-align: center; margin: 12px 0; position: sticky; top: 0; z-index: 2; }
.date-sep span { background: var(--bg-bubble-in); color: var(--text-secondary); font-size: 12px; padding: 6px 12px; border-radius: 8px; box-shadow: var(--shadow-sm); text-transform: uppercase; font-weight: 500; }

.bubble { max-width: 65%; padding: 6px 7px 8px 9px; border-radius: 7.5px; position: relative; box-shadow: var(--shadow-sm); color: var(--text-primary); margin-bottom: 8px; }
.bubble.bubble-new { animation: popIn 0.2s cubic-bezier(0.1, 0.82, 0.25, 1); }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.bubble.mine { background: var(--bg-bubble-out); align-self: flex-end; border-top-right-radius: 0; }
.bubble.theirs { background: var(--bg-bubble-in); align-self: flex-start; border-top-left-radius: 0; }
.bubble.mine::before { content: ''; position: absolute; top: 0; right: -8px; width: 8px; height: 13px; background: var(--bg-bubble-out); clip-path: polygon(0 0, 0% 100%, 100% 0); }
.bubble.theirs::before { content: ''; position: absolute; top: 0; left: -8px; width: 8px; height: 13px; background: var(--bg-bubble-in); clip-path: polygon(100% 0, 100% 100%, 0 0); }
.bubble .text { font-size: 14.2px; line-height: 19px; white-space: pre-wrap; word-break: break-word; padding-right: 60px; margin-bottom: 2px; }
.bubble .meta { font-size: 11px; color: var(--text-secondary); position: absolute; bottom: 4px; right: 7px; display: flex; align-items: center; gap: 3px; float: right; }
.bubble .meta svg { width: 16px; height: 15px; }

.msg-menu-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.08); border: none; border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); z-index: 5; transition: background 0.2s; }
[data-theme="dark"] .msg-menu-btn { background: rgba(255,255,255,0.15); }
.msg-menu-btn svg { width: 16px; height: 16px; }
.bubble:hover .msg-menu-btn { display: flex; }
@media (max-width: 768px) { .msg-menu-btn { display: flex; opacity: 0.6; } }

.reply-quote { font-size: 13px; color: var(--text-secondary); border-left: 4px solid var(--green); padding: 4px 8px; margin-bottom: 6px; background: rgba(0,0,0,0.04); border-radius: 4px; display: flex; flex-direction: column; }
[data-theme="dark"] .reply-quote { background: rgba(255,255,255,0.04); }
.reply-quote strong { color: var(--green); font-size: 12px; margin-bottom: 2px; }
.forwarded-label { font-size: 12px; font-style: italic; color: var(--text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

.call-log { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); padding: 4px; }
.call-log svg { width: 18px; height: 18px; fill: var(--text-secondary); }
.call-log.missed { color: var(--red); }
.call-log.missed svg { fill: var(--red); }

.bubble .img { max-width: 100%; max-height: 300px; border-radius: 6px; display: block; margin-bottom: 4px; cursor: pointer; object-fit: cover; }
.bubble .file { display: flex; gap: 12px; align-items: center; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 6px; color: var(--text-primary); text-decoration: none; margin-bottom: 4px; padding-right: 60px;}
[data-theme="dark"] .bubble .file { background: rgba(255,255,255,0.05); }
.bubble .file-name { font-size: 14px; font-weight: 500; word-break: break-all; }
.bubble .file-size { font-size: 12px; color: var(--text-secondary); }

.voice-note { display: flex; align-items: center; gap: 10px; min-width: 240px; padding: 4px 0; padding-right: 55px;}
.vn-play { background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; }
.vn-play svg { width: 20px; height: 20px; fill: currentColor; }
.vn-waveform { flex: 1; display: flex; align-items: center; height: 24px; gap: 2px; cursor: pointer; position: relative; }
.vn-bar { flex: 1; background: var(--text-secondary); height: 4px; border-radius: 2px; transition: height 0.1s; }
.vn-bar.played { background: var(--green); }
.vn-duration { font-size: 11px; color: var(--text-secondary); min-width: 30px; text-align: right; }
.vn-speed { background: rgba(0,0,0,0.1); border: none; border-radius: 10px; padding: 2px 6px; font-size: 11px; color: var(--text-primary); cursor: pointer; font-weight: 600; }
[data-theme="dark"] .vn-speed { background: rgba(255,255,255,0.1); }

.reaction-badge { position: absolute; bottom: -12px; right: 10px; background: var(--bg-bubble-in); border-radius: 12px; padding: 2px 6px; font-size: 14px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); z-index: 2; }

.composer { background: var(--bg-composer); padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; z-index: 5; min-height: 62px; }
.composer .icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
.composer .icon-btn:hover { color: var(--text-primary); }
.composer .input-wrap { flex: 1; background: var(--bg-input); border-radius: 8px; display: flex; align-items: center; padding: 9px 12px; min-height: 42px; }
.composer textarea { flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 15px; resize: none; outline: none; max-height: 100px; min-height: 24px; line-height: 20px; font-family: inherit; padding: 0; }
.composer .send-btn { background: var(--green-dark); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s, background 0.2s; }
.composer .send-btn:active { transform: scale(0.92); }

.composer-reply { background: var(--bg-composer); padding: 8px 16px 0; display: flex; align-items: center; gap: 12px; }
.composer-reply .bar { width: 4px; height: 35px; background: var(--green); border-radius: 2px; }
.composer-reply .info { flex: 1; overflow: hidden; }
.composer-reply .info strong { display: block; font-size: 13px; color: var(--green); }
.composer-reply .info span { display: block; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer-reply .close { background: none; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; padding: 4px; }

.recording-bar { background: var(--bg-composer); padding: 10px 16px; display: flex; align-items: center; gap: 12px; z-index: 5; min-height: 62px; }
.recording-bar .dot { width: 12px; height: 12px; background: var(--red); border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.recording-bar .timer { font-size: 16px; font-weight: 500; color: var(--red); flex: 1; }
.recording-bar button { padding: 8px 16px; border-radius: 20px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
.recording-bar .btn-cancel { background: var(--bg-sidebar); color: var(--red); border: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
.recording-bar .btn-send { background: var(--green-dark); color: #fff; display: flex; align-items: center; gap: 4px; }

.typing-indicator { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: var(--bg-bubble-in); border-radius: 8px; width: fit-content; box-shadow: var(--shadow-sm); margin-top: 4px; }
.typing-dot { width: 6px; height: 6px; background: var(--text-secondary); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

.modal-bg { position: fixed; inset: 0; background: rgba(11,20,26,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(2px); animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg-sidebar); border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md); animation: slideUp 0.2s; max-height: 88vh; overflow-y: auto; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h2 { font-size: 20px; color: var(--text-primary); margin-bottom: 16px; font-weight: 500; }
.modal button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
.modal .menu-item { display: block; width: 100%; text-align: left; padding: 14px; font-size: 15px; color: var(--text-primary); background: none; border-radius: 8px; margin-bottom: 4px; font-weight: 400; }
.modal .menu-item:hover { background: var(--bg-hover); }

.emoji-bar { display: flex; gap: 8px; background: var(--bg-sidebar); padding: 8px 12px; border-radius: 24px; margin-bottom: 8px; box-shadow: var(--shadow-md); justify-content: center; animation: popIn 0.2s; }
.emoji-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 4px; border-radius: 50%; transition: transform 0.1s; }
.emoji-btn:hover { transform: scale(1.2); background: var(--bg-hover); }

.forward-list { max-height: 300px; overflow-y: auto; margin-top: 16px; }
.forward-item { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; border-radius: 8px; }
.forward-item:hover { background: var(--bg-hover); }

.page-view { position: fixed; inset: 0; background: var(--bg-sidebar); z-index: 150; display: flex; flex-direction: column; animation: slideInRight 0.22s ease; }
@keyframes slideInRight { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.page-header { display: flex; align-items: center; gap: 12px; background: var(--bg-header-light); padding: 14px 16px; min-height: 60px; flex-shrink: 0; }
.page-header .back-btn { background: none; border: none; color: var(--text-header); cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.page-header .back-btn:hover { background: rgba(0,0,0,0.06); }
[data-theme="dark"] .page-header .back-btn:hover { background: rgba(255,255,255,0.06); }
.page-header h1 { font-size: 19px; font-weight: 600; color: var(--text-header); }
.page-body { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-app); }

.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 10px; background: var(--bg-sidebar); margin-bottom: 10px; cursor: pointer; transition: background 0.2s; border: 1px solid var(--border); }
.settings-row:hover { background: var(--bg-hover); }
.settings-row .left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.settings-row .left .icon-wrap { width: 40px; height: 40px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.settings-row .left .icon-wrap svg { width: 20px; height: 20px; fill: #fff; }
.settings-row .left .icon-wrap .avatar { width: 100%; height: 100%; border-radius: 0; }
.settings-row .left .txt { font-size: 15px; color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 4px; }
.settings-row .left .sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.settings-row .right { color: var(--text-secondary); font-size: 22px; margin-left: 8px; }

.profile-pic-edit { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
.profile-pic-edit .big-avatar { width: 110px; height: 110px; border-radius: 50%; background: #dfe5e7; color: #667781; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 600; overflow: hidden; position: relative; text-transform: uppercase; }
.profile-pic-edit .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-pic-edit .edit-btn { margin-top: 14px; background: var(--green-dark); color: #fff; border: none; border-radius: 20px; padding: 9px 20px; font-size: 13px; font-weight: 500; cursor: pointer; }
.profile-pic-edit .remove-btn { margin-top: 6px; background: transparent; color: var(--red); border: 1px solid var(--red); border-radius: 20px; padding: 7px 18px; font-size: 12px; font-weight: 500; cursor: pointer; }

.field-group { margin-bottom: 18px; }
.field-group label { display: block; font-size: 12px; color: var(--green-dark); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
[data-theme="dark"] .field-group label { color: var(--green); }
.field-group input, .field-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-sidebar); color: var(--text-primary); font-size: 15px; outline: none; font-family: inherit; resize: vertical; }
.field-group input:focus, .field-group textarea:focus { border-color: var(--green); }
.field-group textarea { min-height: 80px; }

/* TICK PAGE — single field */
.tick-single { background: var(--bg-sidebar); border-radius: 14px; padding: 24px; border: 1px solid var(--border); }
.tick-single .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.tick-single .title-row .icon-big { width: 48px; height: 48px; border-radius: 50%; background: #53bdeb; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tick-single .title-row .icon-big svg { width: 26px; height: 26px; fill: #fff; }
.tick-single .title-row .t { font-size: 17px; font-weight: 600; }
.tick-single .title-row .s { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.tick-single .hint { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.55; }
.tick-single .field { display: flex; gap: 8px; margin-bottom: 10px; }
.tick-single .field input { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-app); color: var(--text-primary); font-size: 15px; outline: none; font-family: monospace; letter-spacing: 2px; text-transform: uppercase; }
.tick-single .field input:focus { border-color: var(--green); }
.tick-single .field button { background: var(--green-dark); color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.tick-single .field button:hover { background: var(--green); }
.tick-single .msg { font-size: 13px; min-height: 18px; }
.tick-single .msg.err { color: var(--red); }
.tick-single .msg.ok { color: var(--green); }
.tick-current { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(0,168,132,0.1); border-radius: 10px; margin-top: 16px; font-size: 13px; color: var(--green-dark); }
[data-theme="dark"] .tick-current { color: var(--green); }

.call-modal { position: fixed; inset: 0; background: #0b141a; z-index: 200; display: flex; flex-direction: column; }
.call-modal .remote-video { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; overflow: hidden; background: #000; }
.call-modal .remote-video #remote-video { width: 100%; height: 100%; object-fit: cover; background: #000; position: absolute; inset: 0; }
.call-modal .remote-video .connecting-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8696a0; font-size: 14px; z-index: 2; background: rgba(11,20,26,0.85); gap: 14px; }
.call-info { position: absolute; top: 40px; left: 0; right: 0; color: #fff; text-align: center; z-index: 10; pointer-events: none; }
.call-info .call-name { font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
.call-info .call-dur { font-size: 15px; opacity: 0.8; margin-top: 6px; }

.empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); text-align: center; background: var(--bg-header-light); border-bottom: 6px solid var(--green); padding: 40px; }

@media (max-width: 768px) {

}

function unlockAudio() {
  [notifAudio, outgoingAudio, ringtoneAudio].forEach(a => {
    a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(()=>{});

  document.removeEventListener('click', unlockAudio);
  document.removeEventListener('touchstart', unlockAudio);
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

const LS_IDS = 'youlanchat-identities';
const LS_SESSION = 'youlanchat-session';
const LS_CHATS = id => `youlanchat-chats-${id}`;
const LS_PROFILE = id => `youlanchat-profile-${id}`;

function getIdentities() { try { return JSON.parse(localStorage.getItem(LS_IDS) || '[]'); } catch { return []; } }
function saveIdentities(l) { localStorage.setItem(LS_IDS, JSON.stringify(l)); }
function getSessionId() { return sessionStorage.getItem(LS_SESSION); }
function setSessionId(id) { sessionStorage.setItem(LS_SESSION, id); }
function getMyIdentity() { const id = getSessionId(); return id ? getIdentities().find(x => x.id === id) : null; }

function loadProfile(id) {
  try {
    const p = JSON.parse(localStorage.getItem(LS_PROFILE(id)) || '{}');
    return { avatar: p.avatar || '', about: p.about || '', tick: p.tick || null, officialUnlocked: !!p.officialUnlocked };
  } catch { return { avatar: '', about: '', tick: null, officialUnlocked: false }; }
}
function saveProfile(id, profile) { localStorage.setItem(LS_PROFILE(id), JSON.stringify(profile)); }

function createIdentity(name) {
  const id = 'dev-' + Math.random().toString(36).slice(2, 10);
  let list = getIdentities();
  list = list.filter(x => x.name.toLowerCase() !== name.toLowerCase());
  list.push({ id, name });
  if (list.length > 3) list.shift();
  saveIdentities(list);
  setSessionId(id);
  return { id, name };
}

function loadChats(id) { try { return JSON.parse(localStorage.getItem(LS_CHATS(id)) || '{}'); } catch { return {}; } }
function saveChats() {
  if (!state.me) return;
  try { localStorage.setItem(LS_CHATS(state.me.id), JSON.stringify(state.chats)); }
  catch (e) { console.warn('storage full'); }
}

const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
let socket;
function connectWS() {
  socket = new WebSocket(wsUrl);
  socket.onopen = () => {
    if (state.me) {
      const prof = loadProfile(state.me.id);
      socket.send(JSON.stringify({ type: 'hello', from: state.me.id, name: state.me.name, avatar: prof.avatar, about: prof.about, tick: prof.tick }));
    }
    render();
  };
  socket.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (!state.me) return;
    switch (m.type) {
      case 'presence': {
        const map = {};
        for (const d of m.devices) map[d.id] = d;
        let newPeers = false;
        let peersChanged = false;
        // mark all offline first
        for (const id in state.peers) state.peers[id].online = false;
        for (const id in map) {
          if (id === state.me.id) continue;
          const incoming = map[id];
          const existing = state.peers[id];
          if (!existing) newPeers = true;
          // Merge profile fields properly
          state.peers[id] = {
            id,
            name: incoming.name || existing?.name || id,
            online: true,
            avatar: incoming.avatar !== undefined ? incoming.avatar : (existing?.avatar || ''),
            about: incoming.about !== undefined ? incoming.about : (existing?.about || ''),
            tick: incoming.tick !== undefined ? incoming.tick : (existing?.tick || null),
          };
          peersChanged = true;
        }
        if (newPeers) {
          clearTimeout(window.__presenceT);
          window.__presenceT = setTimeout(render, 100);
        } else if (peersChanged) {
          // Selective update — chat list items + chat header + active chat if needed
          Object.keys(state.peers).forEach(id => refreshChatListItem(id));
          if (state.activePeer && state.peers[state.activePeer]) {
            refreshChatHeaderProfile(state.peers[state.activePeer]);
          }
        }
        break;
      }
      case 'history': {
        for (const msg of m.messages) {
          const other = msg.from === state.me.id ? msg.to : msg.from;
          const chat = state.chats[other] || (state.chats[other] = []);
          if (!chat.find(x => x.id === msg.id)) chat.push(msg);
        }
        for (const id in state.chats) state.chats[id].sort((a, b) => a.createdAt - b.createdAt);
        saveChats(); render(); break;
      }
      case 'message': {
        const other = m.message.from;
        const chat = state.chats[other] || (state.chats[other] = []);
        if (!chat.find(x => x.id === m.message.id)) chat.push(m.message);
        notifAudio.currentTime = 0; notifAudio.play().catch(()=>{});
        if (state.activePeer === other) {
          socket.send(JSON.stringify({ type: 'read', from: state.me.id, to: other, ids: [m.message.id] }));
          socket.send(JSON.stringify({ type: 'delivered', from: state.me.id, to: other, ids: [m.message.id] }));
          saveChats(); appendBubbleToDOM(m.message); refreshChatListItem(other);
        } else {
          state.unread[other] = (state.unread[other] || 0) + 1;
          saveChats();
          if (!state.peers[other]) render(); else refreshChatListItem(other);
        }
        break;
      }
      case 'reaction': {
        const chat = state.chats[m.from] || [];
        const msg = chat.find(x => x.id === m.msgId);
        if (msg) { msg.reaction = m.emoji; saveChats(); updateBubbleReaction(msg.id, m.emoji); refreshChatListItem(m.from); }
        break;
      }
      case 'delivered': {
        const chat = state.chats[m.from] || [];
        for (const msg of chat) if (m.ids.includes(msg.id) && msg.status === 'sent') { msg.status = 'delivered'; updateBubbleMeta(msg.id, 'delivered'); }
        saveChats(); break;
      }
      case 'read': {
        const chat = state.chats[m.from] || [];
        for (const msg of chat) if (m.ids.includes(msg.id)) { msg.status = 'read'; updateBubbleMeta(msg.id, 'read'); }
        saveChats(); break;
      }
      case 'typing': {
        const was = !!state.typing[m.from];
        state.typing[m.from] = !!m.state;
        if (m.from === state.activePeer && was !== !!m.state) updateTypingStatus();
        break;
      }
      case 'delete': {
        const chat = state.chats[m.from] || [];
        let updated = null;
        state.chats[m.from] = chat.map(x => { if (x.id === m.id) { updated = { ...x, deleted: true, text: null, dataUrl: null, reaction: null }; return updated; } return x; });
        saveChats();
        if (updated) {
          const bubble = document.querySelector(`.bubble[data-msg-id="${m.id}"]`);
          if (bubble) { const wrap = document.createElement('div'); wrap.innerHTML = renderBubble(updated); bubble.replaceWith(wrap.firstElementChild); }
          refreshChatListItem(m.from);
        }
        break;
      }
      case 'signal': handleSignal(m.from, m.data); break;
    }
  };
  socket.onclose = () => { setTimeout(connectWS, 2000); };
}
function wsSend(m) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(m)); }

let mediaRecorder = null, recChunks = [], recStart = 0, recTimer = null;
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recChunks = []; recStart = Date.now();
    mediaRecorder.ondataavailable = e => e.data.size && recChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer); state.recording = false;
      if (recChunks.length === 0) { mountComposer(); return; }
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      const dataUrl = await blobToDataUrl(blob);
      const dur = Math.round((Date.now() - recStart) / 1000);
      state.recordSecs = 0;
      if (state.activePeer) sendMessage(state.activePeer, { kind: 'voice', dataUrl, duration: dur });
      mountComposer();
    };
    mediaRecorder.start();
    state.recording = true; state.recordSecs = 0;
    recTimer = setInterval(() => {
      state.recordSecs = Math.round((Date.now() - recStart) / 1000);
      const el = document.querySelector('#rec-secs'); if (el) el.textContent = `${String(Math.floor(state.recordSecs/60)).padStart(2,'0')}:${String(state.recordSecs%60).padStart(2,'0')}`;
    }, 200);
    mountComposer();
  } catch (e) { alert('Microphone error: ' + e.message); }
}
function stopRecording(send_) {
  if (!mediaRecorder) return;
  if (!send_) {
    recChunks = [];
    mediaRecorder.onstop = () => { mediaRecorder.stream.getTracks().forEach(t => t.stop()); clearInterval(recTimer); state.recording = false; mountComposer(); };
  }
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}
function blobToDataUrl(b) { return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
async function onFile(e) {
  const files = Array.from(e.target.files || []); e.target.value = '';
  if (!state.activePeer) return;
  for (const f of files) {
    if (f.size > 15 * 1024 * 1024) { alert(`"${f.name}" too large (15MB max).`); continue; }
    const dataUrl = await fileToDataUrl(f);
    let kind = 'file';
    if (f.type.startsWith('image/')) kind = 'image';
    else if (f.type.startsWith('video/')) kind = 'video';
    else if (f.type.startsWith('audio/')) kind = 'audio';
    sendMessage(state.activePeer, { kind, name: f.name, mime: f.type, size: f.size, dataUrl });
  }
}
function fileToDataUrl(f) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); }

/* ============ CALLS ============ */
const RTC_CFG = { iceServers: [] };
async function startCall(type) {
  if (!state.activePeer || state.call || state.activePeer === OFFICIAL_BOT.id) return;
  const peerId = state.activePeer;
  try {
    outgoingAudio.currentTime = 0; outgoingAudio.play().catch(()=>{});
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
    const pc = new RTCPeerConnection(RTC_CFG);
    const localTrackIds = new Set();
    stream.getTracks().forEach(t => { pc.addTrack(t, stream); localTrackIds.add(t.id); });
    state.call = { peerId, type, stream, pc, startedAt: Date.now(), state: 'calling', muted: false, cameraOff: false, remoteStream: null };
    pc.onicecandidate = e => e.candidate && wsSend({ type: 'signal', from: state.me.id, to: peerId, data: { candidate: e.candidate } });
    pc.ontrack = e => {
      if (localTrackIds.has(e.track.id)) return;
      if (!state.call.remoteStream) state.call.remoteStream = new MediaStream();
      if (!state.call.remoteStream.getTracks().includes(e.track)) state.call.remoteStream.addTrack(e.track);
      attachCallStreams();
    };
    pc.onconnectionstatechange = () => {
      if (!state.call) return;
      if (pc.connectionState === 'connected') state.call.state = 'connected';
      if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) endCall(false);
      updateCallDuration();
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    wsSend({ type: 'signal', from: state.me.id, to: peerId, data: { kind: 'offer', callType: type, sdp: offer } });
    mountCallModal();
  } catch (e) { alert('Call failed: ' + e.message); outgoingAudio.pause(); }
}
async function handleSignal(from, data) {
  if (data.kind === 'offer') {
    if (state.call) { wsSend({ type: 'signal', from: state.me.id, to: from, data: { kind: 'end' } }); return; }
    state.incomingCall = { peerId: from, type: data.callType, sdp: data.sdp };
    ringtoneAudio.currentTime = 0; ringtoneAudio.play().catch(()=>{});
    mountIncomingModal();
  } else if (data.kind === 'answer' && state.call?.peerId === from) {
    outgoingAudio.pause();
    await state.call.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
  } else if (data.kind === 'end') {
    if (state.call?.peerId === from) {
      const dur = Math.floor((Date.now() - state.call.startedAt) / 1000);
      if (state.call.state === 'connected') addCallLog(from, state.call.type === 'video', 'answered', dur, false);
      endCall(false);
    }
    if (state.incomingCall?.peerId === from) {
      addCallLog(from, state.incomingCall.type === 'video', 'missed', 0, true);
      state.incomingCall = null; ringtoneAudio.pause(); unmountIncomingModal();
    }
  } else if (data.candidate && state.call?.peerId === from) {
    try { await state.call.pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch {}
  }
}
async function acceptCall() {
  const inc = state.incomingCall; if (!inc) return;
  ringtoneAudio.pause();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: inc.type === 'video' });
    const pc = new RTCPeerConnection(RTC_CFG);
    const localTrackIds = new Set();
    stream.getTracks().forEach(t => { pc.addTrack(t, stream); localTrackIds.add(t.id); });
    state.call = { peerId: inc.peerId, type: inc.type, stream, pc, startedAt: Date.now(), state: 'connected', muted: false, cameraOff: false, remoteStream: null };
    state.incomingCall = null; unmountIncomingModal();
    pc.onicecandidate = e => e.candidate && wsSend({ type: 'signal', from: state.me.id, to: inc.peerId, data: { candidate: e.candidate } });
    pc.ontrack = e => {
      if (localTrackIds.has(e.track.id)) return;
      if (!state.call.remoteStream) state.call.remoteStream = new MediaStream();
      if (!state.call.remoteStream.getTracks().includes(e.track)) state.call.remoteStream.addTrack(e.track);
      attachCallStreams();
    };
    await pc.setRemoteDescription(new RTCSessionDescription(inc.sdp));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    wsSend({ type: 'signal', from: state.me.id, to: inc.peerId, data: { kind: 'answer', sdp: ans } });
    mountCallModal();
  } catch (e) { alert('Cannot accept: ' + e.message); state.incomingCall = null; unmountIncomingModal(); }
}
function rejectCall() {
  if (!state.incomingCall) return;
  ringtoneAudio.pause();
  addCallLog(state.incomingCall.peerId, state.incomingCall.type === 'video', 'rejected', 0, true);
  wsSend({ type: 'signal', from: state.me.id, to: state.incomingCall.peerId, data: { kind: 'end' } });
  state.incomingCall = null; unmountIncomingModal();
}
function endCall(notify = true) {
  if (!state.call) return;
  if (notify) {
    const dur = Math.floor((Date.now() - state.call.startedAt) / 1000);
    if (state.call.state === 'connected') addCallLog(state.call.peerId, state.call.type === 'video', 'answered', dur, false);
    wsSend({ type: 'signal', from: state.me.id, to: state.call.peerId, data: { kind: 'end' } });
  }
  state.call.stream?.getTracks().forEach(t => t.stop());
  try { state.call.pc?.close(); } catch {}
  state.call = null; outgoingAudio.pause(); ringtoneAudio.pause(); unmountCallModal();
}
function toggleMute() {
  if (!state.call) return;
  state.call.muted = !state.call.muted;
  state.call.stream.getAudioTracks().forEach(t => t.enabled = !state.call.muted);
  const btn = document.querySelector('.call-controls button[data-action="mute"]');
  if (btn) btn.textContent = state.call.muted ? '🔇' : '🔊';
}
function toggleCam() {

function attachCallStreams() {

  const lv = document.querySelector('#local-video');

  if (state.call.remoteStream) { const ov = document.querySelector('.remote-video .connecting-overlay'); if (ov) ov.remove(); }
}
function mountCallModal() {
  unmountCallModal(); if (!state.call) return;
  const tmp = document.createElement('div'); tmp.innerHTML = renderCall();
  document.body.appendChild(tmp.firstElementChild);

  if (last && last.reaction) previewText = last.from === state.me.id ? `You reacted "${last.reaction}"` : `React "${last.reaction}" to your message`;
  const html = `<div class="avatar-wrap">
      <div class="avatar" style="width:49px; height:49px; font-size:20px;${p.isOfficial ? 'background:var(--green);color:#fff;' : ''}">${renderAvatar(p)}</div>
      ${!p.isOfficial && p.online ? '<div class="online-dot"></div>' : ''}
    </div>
    <div class="body">
      <div class="row-top">
        <div class="name">${esc(p.name)}${renderTickBadge(p.tick)}${p.isOfficial ? renderTickBadge('blue') : ''}</div>
        <div class="time">${last ? fmtTime(last.createdAt) : ''}</div>
      </div>
      <div class="row-bottom">
        <div class="preview" style="${last && last.reaction ? 'color:var(--green);font-weight:500;' : ''}">${esc(previewText)}</div>
        ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
      </div>
    </div>`;
  if (existing) { existing.innerHTML = html; existing.classList.toggle('active', state.activePeer === peerId); list.prepend(existing); }
  else {
    const el = document.createElement('div');
    el.className = 'chat-item' + (state.activePeer === peerId ? ' active' : '');
    el.dataset.action = 'select'; el.dataset.id = peerId; el.innerHTML = html; list.prepend(el);
  }
  const placeholder = list.querySelector('div[style*="Looking for devices"]'); if (placeholder) placeholder.remove();
}
function refreshChatHeaderProfile(peer) {
  const header = document.querySelector('.chat-header'); if (!header) return;
  const avatarEl = header.querySelector('.avatar');
  const nameEl = header.querySelector('.info .name');
  if (avatarEl) avatarEl.innerHTML = renderAvatar(peer);
  if (nameEl) nameEl.innerHTML = esc(peer.name) + renderTickBadge(peer.tick) + (peer.isOfficial ? renderTickBadge('blue') : '');
}
function updateTypingStatus() {
  const p = state.peers[state.activePeer]; if (!p) return;
  const st = document.querySelector('.chat-header .status');
  if (st) st.textContent = state.typing[p.id] ? 'typing…' : (p.online ? 'online' : 'offline');
  const msgs = document.querySelector('#messages'); if (!msgs) return;
  let ind = msgs.querySelector('.typing-indicator');
  if (state.typing[p.id]) { if (!ind) { ind = document.createElement('div'); ind.className = 'typing-indicator'; ind.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>'; msgs.appendChild(ind); } msgs.scrollTop = msgs.scrollHeight; }
  else if (ind) ind.remove();
}
function mountComposer() {
  if (!state.activePeer) return;
  const old = document.querySelector('.composer, .recording-bar');
  const oldReply = document.querySelector('.composer-reply'); if (oldReply) oldReply.remove();
  if (!old) return;
  if (state.replyTo) {
    const div = document.createElement('div'); div.className = 'composer-reply';
    div.innerHTML = `<div class="bar"></div><div class="info"><strong>${esc(state.peers[state.replyTo.from]?.name || 'You')}</strong><span>${esc(previewOf(state.replyTo))}</span></div><button class="close" data-action="cancel-reply">✕</button>`;
    old.parentNode.insertBefore(div, old);
  }
  if (state.recording) {
    if (!old.classList.contains('recording-bar')) {
      const div = document.createElement('div');
      div.innerHTML = `<div class="recording-bar"><div class="dot"></div><div class="timer" id="rec-secs">${String(Math.floor(state.recordSecs/60)).padStart(2,'0')}:${String(state.recordSecs%60).padStart(2,'0')}</div><button class="btn-cancel" data-action="cancel-rec">${ICONS.trash} Cancel</button><button class="btn-send" data-action="stop-rec">${ICONS.send} Send</button></div>`;
      old.replaceWith(div.firstElementChild);
    }
  } else {
    if (!old.classList.contains('composer')) {
      const div = document.createElement('div');
      div.innerHTML = `<div class="composer"><button class="icon-btn" data-action="attach">${ICONS.attach}</button><input type="file" id="file-input" hidden multiple><div class="input-wrap"><textarea id="composer-text" placeholder="Type a message" rows="1"></textarea></div><button class="send-btn" id="send-btn" data-action="record">${ICONS.mic}</button></div>`;
      const comp = div.firstElementChild; old.replaceWith(comp);
      const ta = comp.querySelector('#composer-text'); if (ta) { ta.addEventListener('input', onComposerInput); ta.addEventListener('keydown', onKeyComposer); ta.value = state.draft[state.activePeer] || ''; }
      const fi = comp.querySelector('#file-input'); if (fi) fi.addEventListener('change', onFile);
      updateSendBtn();
    }
  }
}

/* ============ PAGES ============ */

  if (tmp.firstElementChild) document.body.appendChild(tmp.firstElementChild);
}
function closePage() { state.currentPage = null; document.querySelector('.page-view')?.remove(); }

/* ============ MAIN RENDER ============ */
function render() {
  const app = document.getElementById('app');
  if (!state.me) { app.innerHTML = welcomeHtml(); bindWelcome(); return; }
  app.innerHTML = appHtml();
  bindApp(); scrollMsgs(); restoreDraft();
}

function welcomeHtml() {
  const existing = getIdentities();
  const existingHtml = existing.length ? `<div class="existing"><h3>Continue as…</h3>
    ${existing.map(x => `<button class="btn-secondary" data-action="pick-id" data-id="${x.id}">${esc(x.name)}</button>`).join('')}
    <button class="btn-secondary btn-clear" data-action="clear-data">Clear All Data</button></div>` : '';
  return `<div class="welcome-screen"><div class="welcome-card">
    <div class="welcome-logo">${ICONS.chat}</div>
    <h1>YoulanChat</h1>
    <p>Stay connected. Locally.</p>
    <div class="input-group"><label>What should we call you?</label>
      <input id="name-input" type="text" placeholder="e.g. Syed Fahran" maxlength="30" autocomplete="off">
    </div>
    <button class="btn-primary" id="start-btn" disabled>Start Chatting</button>
    ${existingHtml}
  </div></div>`;
}
function bindWelcome() {
  const i = document.getElementById('name-input'), b = document.getElementById('start-btn');
  if (i) { i.addEventListener('input', () => b.disabled = !i.value.trim()); i.addEventListener('keydown', e => { if (e.key === 'Enter' && !b.disabled) b.click(); }); setTimeout(() => i.focus(), 50); }
  if (b) b.addEventListener('click', () => {
    const name = i.value.trim(); if (!name) return;
    state.me = createIdentity(name);
    state.chats = loadChats(state.me.id);
    if (loadProfile(state.me.id).officialUnlocked) ensureOfficialChatExists();
    saveChats();
    connectWS(); render();
  });
  document.querySelectorAll('[data-action="pick-id"]').forEach(el => {
    el.addEventListener('click', () => {
      setSessionId(el.dataset.id);
      state.me = getMyIdentity();
      if (state.me) {
        state.chats = loadChats(state.me.id);
        if (loadProfile(state.me.id).officialUnlocked) ensureOfficialChatExists();
        saveChats();
        connectWS(); render();
      }
    });
  });
  const clearBtn = document.querySelector('[data-action="clear-data"]');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (confirm("Delete all data?")) { localStorage.clear(); sessionStorage.clear(); location.reload(); }
  });
}

function appHtml() {
  const open = !!state.activePeer;
  const myProf = state.me ? loadProfile(state.me.id) : { avatar: '', tick: null };
  return `
    <aside class="sidebar ${open ? 'hidden-mobile' : ''}">
      <div class="sidebar-header">
        <div class="avatar" data-action="open-profile-page">${renderAvatar({ ...state.me, avatar: myProf.avatar })}</div>
        <div class="info"><div class="name">${esc(state.me.name)}${renderTickBadge(myProf.tick)}</div></div>
        <div class="actions">
          <button data-action="toggle-theme">${state.theme === 'dark' ? ICONS.light : ICONS.dark}</button>
          <button data-action="open-settings-page">${ICONS.settings}</button>
        </div>
      </div>
      <div class="search-container"><div class="search-box">${ICONS.search}<input type="text" placeholder="Search or start new chat" disabled></div></div>
      <div class="chat-list">${renderList()}</div>
    </aside>
    <main class="main-area ${open ? 'active' : ''}">
      ${open ? renderChat() : `<div class="empty-chat"><h2>YoulanChat Web</h2><p>Send and receive messages without keeping your phone online.</p></div>`}
    </main>`;
}

function renderAvatar(entity) {
  if (!entity) return '?';
  if (entity.avatar) return `<img src="${entity.avatar}" alt="">`;
  return esc((entity.name || '?')[0].toUpperCase());
}

function renderList() {
  const peers = Object.values(state.peers);
  peers.sort((a, b) => {
    const la = state.chats[a.id]?.[state.chats[a.id].length - 1]?.createdAt || 0;
    const lb = state.chats[b.id]?.[state.chats[b.id].length - 1]?.createdAt || 0;
    return lb - la;
  });
  const officialUnlocked = state.me && loadProfile(state.me.id).officialUnlocked;
  const officialHtml = officialUnlocked ? renderChatItem(OFFICIAL_BOT) : '';
  const peerHtml = peers.map(p => renderChatItem(p)).join('');
  if (!peers.length && !officialUnlocked) {
    return `<div style="padding:40px 24px; text-align:center; color:var(--text-secondary); line-height:1.7;">
      <strong style="color:var(--text-primary); font-size:15px;">Looking for devices…</strong><br><br>
      <span style="font-size:14px;">Make sure other devices are on the same Wi-Fi and have opened this page.</span></div>`;
  }
  return officialHtml + peerHtml;
}

function renderChatItem(p) {
  const chat = state.chats[p.id] || [];
  const last = chat[chat.length - 1];
  const unread = state.unread[p.id] || 0;
  let previewText = last ? previewOf(last) : (p.isOfficial ? 'Verified' : (p.online ? 'Online' : 'Offline'));
  if (last && last.reaction) previewText = last.from === state.me.id ? `You reacted "${last.reaction}"` : `React "${last.reaction}" to your message`;
  return `<div class="chat-item ${state.activePeer === p.id ? 'active' : ''}" data-action="select" data-id="${p.id}">
    <div class="avatar-wrap">
      <div class="avatar" style="width:49px; height:49px; font-size:20px;${p.isOfficial ? 'background:var(--green);color:#fff;' : ''}">${renderAvatar(p)}</div>
      ${!p.isOfficial && p.online ? '<div class="online-dot"></div>' : ''}
    </div>
    <div class="body">
      <div class="row-top">
        <div class="name">${esc(p.name)}${renderTickBadge(p.tick)}${p.isOfficial ? renderTickBadge('blue') : ''}</div>
        <div class="time">${last ? fmtTime(last.createdAt) : ''}</div>
      </div>
      <div class="row-bottom">
        <div class="preview" style="${last && last.reaction ? 'color:var(--green);font-weight:500;' : ''}">${esc(previewText)}</div>
        ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function renderChat() {
  const isOfficial = state.activePeer === OFFICIAL_BOT.id;
  const p = isOfficial ? OFFICIAL_BOT : state.peers[state.activePeer];
  if (!p) { state.activePeer = null; return appHtml(); }
  const chat = state.chats[p.id] || [];
  const typing = state.typing[p.id];
  let messagesHtml = ''; let lastDate = '';
  chat.forEach(m => {
    const mDate = new Date(m.createdAt).toDateString();
    if (mDate !== lastDate) {
      const today = new Date().toDateString(); const yesterday = new Date(Date.now() - 86400000).toDateString();
      let dateText = new Date(m.createdAt).toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
      if (mDate === today) dateText = 'TODAY'; else if (mDate === yesterday) dateText = 'YESTERDAY';
      messagesHtml += `<div class="date-sep"><span>${dateText}</span></div>`; lastDate = mDate;
    }
    messagesHtml += renderBubble(m);
  });
  return `
    <div class="chat-header">
      <button class="back" data-action="back">${ICONS.back}</button>
      <div class="avatar" style="${isOfficial ? 'background:var(--green);color:#fff;' : ''}">${renderAvatar(p)}</div>
      <div class="info">
        <div class="name">${esc(p.name)}${renderTickBadge(p.tick)}${isOfficial ? renderTickBadge('blue') : ''}</div>
        <div class="status">${isOfficial ? 'Official Account · Verified' : (typing ? 'typing…' : (p.online ? 'online' : 'offline'))}</div>
      </div>
      <div class="actions">
        ${isOfficial ? '' : `<button data-action="video-call">${ICONS.video}</button><button data-action="audio-call">${ICONS.phone}</button>`}
      </div>
    </div>
    <div class="messages-wrap"><div class="messages" id="messages">
      ${messagesHtml}
      ${typing ? `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>` : ''}
    </div></div>
    ${state.replyTo ? `<div class="composer-reply"><div class="bar"></div><div class="info"><strong>${esc(state.peers[state.replyTo.from]?.name || 'You')}</strong><span>${esc(previewOf(state.replyTo))}</span></div><button class="close" data-action="cancel-reply">✕</button></div>` : ''}
    ${state.recording ? `<div class="recording-bar"><div class="dot"></div><div class="timer" id="rec-secs">${String(Math.floor(state.recordSecs/60)).padStart(2,'0')}:${String(state.recordSecs%60).padStart(2,'0')}</div><button class="btn-cancel" data-action="cancel-rec">${ICONS.trash} Cancel</button><button class="btn-send" data-action="stop-rec">${ICONS.send} Send</button></div>` : `
      <div class="composer">
        <button class="icon-btn" data-action="attach">${ICONS.attach}</button>
        <input type="file" id="file-input" hidden multiple>
        <div class="input-wrap"><textarea id="composer-text" placeholder="Type a message" rows="1"></textarea></div>
        <button class="send-btn" id="send-btn" data-action="record">${ICONS.mic}</button>
      </div>`}
  `;
}

function renderBubble(m) {
  const mine = m.from === state.me.id;
  let content = '';
  if (m.kind === 'call') {
    const isMissed = m.status === 'missed' || m.status === 'rejected';
    const isIncoming = m.from !== state.me.id;
    const icon = m.isVideo ? ICONS.video : (isMissed ? ICONS.call_missed : (isIncoming ? ICONS.call_received : ICONS.call_made));
    const dur = m.duration ? ` (${m.duration}s)` : '';
    content = `<div class="call-log ${isMissed ? 'missed' : ''}">${icon} ${isIncoming ? 'Incoming' : 'Outgoing'} ${m.isVideo ? 'Video' : 'Voice'} Call${dur}</div>`;
  } else if (m.deleted) {
    content = `<div class="text" style="font-style:italic; opacity:0.7;">🚫 This message was deleted</div>`;
  } else if (m.kind === 'text') {
    content = `<div class="text">${esc(m.text)}</div>`;
  } else if (m.kind === 'image') {
    content = `<img class="img" src="${m.dataUrl}" onclick="window.open('${m.dataUrl}','_blank')">`;
  } else if (m.kind === 'video') {
    content = `<video class="img" src="${m.dataUrl}" controls></video>`;
  } else if (m.kind === 'audio') {
    content = `<audio class="audio" src="${m.dataUrl}" controls></audio>`;
  } else if (m.kind === 'voice') {
    const dur = m.duration || 0;
    const fmtDur = `${String(Math.floor(dur/60)).padStart(2,'0')}:${String(dur%60).padStart(2,'0')}`;
    let barsHtml = '';
    for(let i=0; i<25; i++) barsHtml += `<div class="vn-bar" style="height:${4 + Math.random() * 12}px"></div>`;
    content = `<div class="voice-note">
      <button class="vn-play" id="play-icon-${m.id}" onclick="window.toggleAudio('${m.id}')">${ICONS.play}</button>
      <audio id="audio-${m.id}" src="${m.dataUrl}" ontimeupdate="window.onAudioTimeUpdate('${m.id}')" onended="window.onAudioEnded('${m.id}')" hidden></audio>
      <div class="vn-waveform" id="wave-${m.id}" onclick="window.seekAudio(event, '${m.id}')">${barsHtml}</div>
      <span class="vn-duration" id="time-${m.id}">${fmtDur}</span>
      <button class="vn-speed" id="speed-${m.id}" onclick="window.changeSpeed('${m.id}')">1x</button>
    </div>`;
  } else if (m.kind === 'file') {
    content = `<a class="file" href="${m.dataUrl}" download="${esc(m.name)}"><div style="font-size:24px; color:var(--text-secondary);">📄</div><div><div class="file-name">${esc(m.name)}</div><div class="file-size">${fmtSize(m.size)}</div></div></a>`;
  }
  const reply = m.replyTo ? `<div class="reply-quote"><strong>${esc(state.peers[m.replyTo.id]?.name || 'You')}</strong>↪ ${esc(m.replyTo.text)}</div>` : '';
  const forwarded = m.forwarded ? `<div class="forwarded-label">↪ Forwarded</div>` : '';
  let check = '';
  if (m.kind !== 'call' && mine && !m.deleted && state.activePeer !== OFFICIAL_BOT.id) {
    check = m.status === 'read' ? `<span style="color:var(--blue-check)">${ICONS.check2}</span>` : m.status === 'delivered' ? `<span>${ICONS.check2}</span>` : `<span>${ICONS.check1}</span>`;
  }
  const reaction = m.reaction ? `<div class="reaction-badge">${m.reaction}</div>` : '';
  const menuBtn = m.kind !== 'call' && state.activePeer !== OFFICIAL_BOT.id ? `<button class="msg-menu-btn" data-action="open-menu" data-id="${m.id}">${ICONS.menu}</button>` : '';
  return `<div class="bubble ${mine ? 'mine' : 'theirs'} ${m.deleted ? 'deleted' : ''}" data-msg-id="${m.id}">
    ${menuBtn}${reply}${forwarded}${content}
    <div class="meta"><span>${fmtTime(m.createdAt).replace(',', '')}</span>${check}</div>
    ${reaction}
  </div>`;
}

function renderMenu() {
  const m = findMsg(state.menuOpenFor); if (!m) return '';
  const mine = m.from === state.me.id;
  return `<div class="modal-bg" data-modal="menu" data-action="close-menu-bg" style="align-items:center;">
    <div style="display:flex; flex-direction:column; align-items:center;">
      <div class="emoji-bar">
        ${['👍','❤️','😂','😮','😢','🙏'].map(e => `<button class="emoji-btn" data-action="react" data-emoji="${e}">${e}</button>`).join('')}
      </div>
      <div class="modal" style="max-width:280px; padding:8px;">
        <button class="menu-item" data-action="reply">↪ Reply</button>
        <button class="menu-item" data-action="forward">➡ Forward</button>
        <button class="menu-item" data-action="del-me">🗑 Delete for me</button>
        ${mine ? `<button class="menu-item" data-action="del-all">🗑 Delete for everyone</button>` : ''}
        <button class="menu-item" data-action="close-menu" style="color:var(--red); font-weight:500;">Cancel</button>
      </div>
    </div>
  </div>`;
}
function renderForwardModal() {
  const peers = Object.values(state.peers).filter(p => p.id !== state.me.id);
  return `<div class="modal-bg" data-modal="forward" data-action="close-forward-bg"><div class="modal">
    <h2>Forward to…</h2>
    <div class="forward-list">
      ${peers.map(p => `<div class="forward-item" data-action="do-forward" data-id="${p.id}"><div class="avatar">${renderAvatar(p)}</div><div style="flex:1; font-weight:500;">${esc(p.name)}</div></div>`).join('') || '<p style="text-align:center; color:var(--text-secondary); padding:20px;">No other devices online</p>'}
    </div>
    <button class="secondary" data-action="close-forward" style="width:100%; margin-top:16px; background:var(--bg-app); color:var(--text-primary); border:none; padding:12px; border-radius:8px;">Cancel</button>
  </div></div>`;
}
function renderIncoming() {
  const inc = state.incomingCall;
  const p = state.peers[inc.peerId] || { name: 'Unknown' };
  return `<div class="modal-bg" data-modal="incoming"><div class="modal" style="text-align:center;">
    <div class="avatar" style="width:80px; height:80px; font-size:32px; margin:0 auto 20px;">${renderAvatar(p)}</div>
    <h2 style="font-size:22px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:6px;">${esc(p.name)}${renderTickBadge(p.tick)}</h2>
    <p style="color:var(--text-secondary); margin-bottom:24px; font-size:14px;">Incoming ${inc.type} call…</p>
    <div style="display:flex; gap:12px; justify-content:center;">
      <button class="danger" data-action="reject" style="padding:14px 28px; border-radius:24px; font-size:15px; background:var(--red); color:#fff;">Reject</button>
      <button class="primary" data-action="accept" style="padding:14px 28px; border-radius:24px; font-size:15px; background:var(--green-dark); color:#fff;">Accept</button>
    </div>
  </div></div>`;
}
function renderCall() {
  const c = state.call;
  const p = state.peers[c.peerId] || { name: 'Unknown' };
  return `<div class="call-modal">
    <div class="call-info">
      <div class="call-name">${esc(p.name)}${renderTickBadge(p.tick)}</div>
      <div class="call-dur" id="call-dur">Calling…</div>
    </div>
    ${c.type === 'video'
      ? `<div class="remote-video">
           <video id="remote-video" autoplay playsinline></video>
           ${!c.remoteStream ? `<div class="connecting-overlay"><div class="avatar" style="width:90px; height:90px; font-size:36px; background:#2a3942; color:#8696a0; overflow:hidden;">${renderAvatar(p)}</div><div>Connecting video…</div></div>` : ''}
         </div>
         <video id="local-video" class="local-video-pip" autoplay playsinline muted></video>`
      : `<div class="remote-video"><div class="avatar" style="width:100px; height:100px; font-size:40px; margin-bottom:20px; overflow:hidden;">${renderAvatar(p)}</div></div><audio id="remote-audio" autoplay playsinline hidden></audio>`}
    <div class="call-controls">
      <button data-action="mute">${c.muted ? '🔇' : '🔊'}</button>
      ${c.type === 'video' ? `<button data-action="cam">${c.cameraOff ? '📷' : '🎥'}</button>` : ''}
      <button class="end" data-action="end">📞</button>
    </div>
  </div>`;
}

function bindApp() {
  const ta = document.querySelector('#composer-text');
  if (ta) { ta.addEventListener('input', onComposerInput); ta.addEventListener('keydown', onKeyComposer); }
  const fi = document.querySelector('#file-input');
  if (fi) fi.addEventListener('change', onFile);
}
function scrollMsgs() { const m = document.querySelector('#messages'); if (m) m.scrollTop = m.scrollHeight; }
function restoreDraft() {
  if (!state.activePeer) return;
  const ta = document.querySelector('#composer-text'); if (!ta) return;
  const draft = state.draft[state.activePeer] || '';
  if (ta.value !== draft) { const s = ta.selectionStart, e = ta.selectionEnd; ta.value = draft; try { ta.setSelectionRange(s, e); } catch(_) {} }
  ta.style.height = '24px'; ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
  updateSendBtn();
}
function findMsg(id) { for (const p in state.chats) { const m = state.chats[p].find(x => x.id === id); if (m) return m; } return null; }

/* ============ CLICK HANDLERS ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case 'select': {
      const id = el.dataset.id;
      state.activePeer = id; state.unread[id] = 0;
      if (id !== OFFICIAL_BOT.id) {
        const chat = state.chats[id] || [];
        const ids = chat.filter(m => m.from === id && m.status !== 'read').map(m => m.id);
        if (ids.length) wsSend({ type: 'read', from: state.me.id, to: id, ids });
      }
      state.typing[id] = false;
      render(); break;
    }
    case 'back': state.activePeer = null; render(); break;
    case 'send': sendText(); break;
    case 'record': startRecording(); break;
    case 'stop-rec': stopRecording(true); break;
    case 'cancel-rec': stopRecording(false); break;
    case 'attach': document.querySelector('#file-input')?.click(); break;
    case 'toggle-theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('youlanchat-theme', state.theme);
      document.documentElement.setAttribute('data-theme', state.theme);
      if (state.currentPage === 'settings') openPage('settings'); else render();
      break;
    }
    case 'toggle-theme-page': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('youlanchat-theme', state.theme);
      document.documentElement.setAttribute('data-theme', state.theme);
      openPage('settings');
      break;
    }

    case 'open-settings-page': openPage('settings'); break;
    case 'open-profile-page': openPage('profile'); break;
    case 'open-tick-page': openPage('tick'); break;
    case 'page-back': closePage(); break;

    case 'pick-avatar': document.querySelector('#avatar-input')?.click(); break;
    case 'remove-avatar': {
      const prof = loadProfile(state.me.id); prof.avatar = '';
      saveProfile(state.me.id, prof);
      wsSend({ type: 'hello', from: state.me.id, name: state.me.name, avatar: prof.avatar, about: prof.about, tick: prof.tick });
      openPage('profile'); render(); break;
    }
    case 'save-profile': {
      const name = document.getElementById('prof-name')?.value.trim();
      const about = document.getElementById('prof-about')?.value.trim() || '';
      if (name) state.me.name = name;
      const prof = loadProfile(state.me.id); prof.about = about;
      saveProfile(state.me.id, prof);
      const l = getIdentities(); const i = l.findIndex(x => x.id === state.me.id);
      if (i >= 0 && name) { l[i].name = name; saveIdentities(l); }
      wsSend({ type: 'hello', from: state.me.id, name: state.me.name, avatar: prof.avatar, about: prof.about, tick: prof.tick });
      closePage(); render(); break;
    }

    case 'apply-tick': {
      const input = document.getElementById('tick-code-input');
      const msg = document.getElementById('tick-msg');
      const val = (input?.value || '').trim();
      if (!val) { msg.className = 'msg err'; msg.textContent = 'Please enter a code.'; return; }
      const res = applyTickCode(val);
      if (!res.ok) { msg.className = 'msg err'; msg.textContent = res.error; return; }
      input.value = '';
      msg.className = 'msg ok';
      msg.textContent = 'Code accepted — badge unlocked!';
      render();
      break;
    }

    case 'audio-call': startCall('audio'); break;
    case 'video-call': startCall('video'); break;
    case 'accept': acceptCall(); break;
    case 'reject': rejectCall(); break;
    case 'end': endCall(); break;
    case 'mute': toggleMute(); break;
    case 'cam': toggleCam(); break;

    case 'open-menu': {
      state.menuOpenFor = el.dataset.id;
      document.querySelector('[data-modal="menu"]')?.remove();
      const tmp = document.createElement('div'); tmp.innerHTML = renderMenu();
      if (tmp.firstElementChild) document.body.appendChild(tmp.firstElementChild);
      break;
    }
    case 'close-menu': case 'close-menu-bg': {
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      break;
    }
    case 'react': {
      const emoji = el.dataset.emoji;
      const msgId = state.menuOpenFor;
      const peerId = state.activePeer;
      const msg = findMsg(msgId);
      if (msg && peerId && state.activePeer !== OFFICIAL_BOT.id) {
        msg.reaction = emoji; saveChats();
        wsSend({ type: 'reaction', from: state.me.id, to: msg.from === state.me.id ? msg.to : msg.from, msgId, emoji });
        updateBubbleReaction(msgId, emoji);
        refreshChatListItem(peerId);
      }
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      break;
    }
    case 'forward': {
      state.forwardingMsg = findMsg(state.menuOpenFor);
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      const tmp = document.createElement('div'); tmp.innerHTML = renderForwardModal();
      document.body.appendChild(tmp.firstElementChild);
      break;
    }
    case 'close-forward': case 'close-forward-bg': {
      state.forwardingMsg = null;
      document.querySelector('[data-modal="forward"]')?.remove();
      break;
    }
    case 'do-forward': {
      const peerId = el.dataset.id;
      const original = state.forwardingMsg;
      if (original && peerId) {
        const newMsg = { ...original, id: 'msg-' + Math.random().toString(36).slice(2, 12), from: state.me.id, to: peerId, createdAt: Date.now(), status: 'sent', forwarded: true, reaction: null };
        const chat = state.chats[peerId] || (state.chats[peerId] = []);
        chat.push(newMsg); saveChats();
        wsSend({ type: 'message', from: state.me.id, to: peerId, message: newMsg });
        if (state.activePeer === peerId) appendBubbleToDOM(newMsg);
        refreshChatListItem(peerId);
      }
      state.forwardingMsg = null;
      document.querySelector('[data-modal="forward"]')?.remove();
      break;
    }
    case 'reply': {
      const m = findMsg(state.menuOpenFor); if (m) state.replyTo = m;
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      mountComposer();
      setTimeout(() => document.querySelector('#composer-text')?.focus(), 50);
      break;
    }
    case 'cancel-reply': { state.replyTo = null; document.querySelector('.composer-reply')?.remove(); break; }
    case 'del-me': {
      const id = state.menuOpenFor;
      if (state.activePeer && id) {
        state.chats[state.activePeer] = state.chats[state.activePeer].filter(m => m.id !== id);
        saveChats();
        document.querySelector(`.bubble[data-msg-id="${id}"]`)?.remove();
        refreshChatListItem(state.activePeer);
      }
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      break;
    }
    case 'del-all': {
      const id = state.menuOpenFor;
      if (state.activePeer && id) {
        let updated = null;
        state.chats[state.activePeer] = state.chats[state.activePeer].map(m => {
          if (m.id === id) { updated = { ...m, deleted: true, text: null, dataUrl: null, reaction: null }; return updated; }
          return m;
        });
        saveChats();
        wsSend({ type: 'delete', from: state.me.id, id });
        const bubble = document.querySelector(`.bubble[data-msg-id="${id}"]`);
        if (bubble && updated) { const wrap = document.createElement('div'); wrap.innerHTML = renderBubble(updated); bubble.replaceWith(wrap.firstElementChild); }
        refreshChatListItem(state.activePeer);
      }
      state.menuOpenFor = null;
      document.querySelector('[data-modal="menu"]')?.remove();
      break;
    }
  }
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'avatar-input') {
    const f = e.target.files?.[0]; if (!f) return;
    if (!f.type.startsWith('image/')) return;
    if (f.size > 3 * 1024 * 1024) { alert('Image must be under 3MB.'); return; }
    const dataUrl = await fileToDataUrl(f);
    const prof = loadProfile(state.me.id); prof.avatar = dataUrl;
    saveProfile(state.me.id, prof);
    wsSend({ type: 'hello', from: state.me.id, name: state.me.name, avatar: prof.avatar, about: prof.about, tick: prof.tick });
    if (state.currentPage === 'profile') openPage('profile');
    render();
  }
});

let pressT;
document.addEventListener('touchstart', e => { const b = e.target.closest('.bubble'); if (!b) return; pressT = setTimeout(() => {
  if (!state.menuOpenFor && b.dataset.msgId && state.activePeer !== OFFICIAL_BOT.id) {
    state.menuOpenFor = b.dataset.msgId;
    document.querySelector('[data-modal="menu"]')?.remove();
    const tmp = document.createElement('div'); tmp.innerHTML = renderMenu();
    if (tmp.firstElementChild) document.body.appendChild(tmp.firstElementChild);
  }
}, 550); }, { passive: true });
['touchend','touchmove','touchcancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressT)));
document.addEventListener('contextmenu', e => {
  const b = e.target.closest('.bubble'); if (!b || !b.dataset.msgId) return;
  if (state.activePeer === OFFICIAL_BOT.id) return;
  e.preventDefault();
  state.menuOpenFor = b.dataset.msgId;
  document.querySelector('[data-modal="menu"]')?.remove();
  const tmp = document.createElement('div'); tmp.innerHTML = renderMenu();
  if (tmp.firstElementChild) document.body.appendChild(tmp.firstElementChild);
});

function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtTime(ts) { const d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }); }
function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB'; return (b/(1024*1024)).toFixed(1) + ' MB'; }

/* ============ INIT ============ */
(function init() {
  const sid = getSessionId();
  if (sid) {
    const m = getMyIdentity();
    if (m) {
      state.me = m;
      state.chats = loadChats(m.id);
      if (loadProfile(m.id).officialUnlocked) ensureOfficialChatExists();
      saveChats();
    }
  }
  if (state.me) connectWS();
  window.addEventListener('beforeunload', () => { if (state.me) wsSend({ type: 'bye', from: state.me.id }); });
  setInterval(updateCallDuration, 1000);
  render();
})();
</script>
</body>
</html>
