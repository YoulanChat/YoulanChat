<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YoulanChat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

:root {
  --bg-main:#f0f2f5; --bg-sidebar:#fff; --bg-chat:#efeae2; --bg-header:#075E54;
  --bg-bubble-out:#d9fdd3; --bg-bubble-in:#fff; --bg-input:#fff;
  --text-primary:#111b21; --text-secondary:#667781; --text-header:#fff;
  --border:#e9edef; --green:#25D366; --green-dark:#128C7E; --blue-check:#53bdeb;
  --red:#ef4444; --hover:#f5f6f6;
}
[data-theme="dark"] {
  --bg-main:#0b141a; --bg-sidebar:#111b21; --bg-chat:#0b141a; --bg-header:#202c33;
  --bg-bubble-out:#005c4b; --bg-bubble-in:#202c33; --bg-input:#2a3942;
  --text-primary:#e9edef; --text-secondary:#8696a0; --text-header:#e9edef;
  --border:#222d34; --hover:#202c33;
}

#app { height:100%; display:flex; }

/* Welcome */
.welcome { flex:1; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#075E54 0%,#25D366 100%); padding:20px; overflow-y:auto; }
.welcome-card { background:var(--bg-sidebar); border-radius:16px; padding:32px; max-width:440px; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35); }
.welcome h1 { font-size:34px; color:var(--green-dark); font-weight:800; margin-bottom:4px; }
[data-theme="dark"] .welcome h1 { color:var(--green); }
.welcome .tagline { color:var(--text-secondary); font-size:14px; margin-bottom:26px; }
.welcome label { display:block; font-size:13px; color:var(--text-secondary); font-weight:500; margin-bottom:6px; }
.welcome input { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px;
  background:var(--bg-main); color:var(--text-primary); font-size:15px; outline:none; margin-bottom:16px; }
.welcome input:focus { border-color:var(--green); }
.welcome button { width:100%; padding:14px; background:var(--green); color:#fff; border:none;
  border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
.welcome button:hover { background:var(--green-dark); }
.welcome button:disabled { opacity:.5; cursor:not-allowed; }
.welcome .existing { margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
.welcome .existing h3 { font-size:12px; color:var(--text-secondary); margin-bottom:10px; font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
.welcome .existing button { background:var(--bg-main); color:var(--text-primary); font-size:14px; padding:10px; margin-bottom:6px; }
.welcome .existing button:hover { background:var(--border); }
.welcome .note { font-size:12px; color:var(--text-secondary); margin-top:22px; line-height:1.6; text-align:center; }
.welcome .note code { background:var(--bg-main); padding:2px 6px; border-radius:4px; font-size:11px; }

/* Layout */
.sidebar { width:380px; display:flex; flex-direction:column; background:var(--bg-sidebar);
  border-right:1px solid var(--border); flex-shrink:0; }
.main-area { flex:1; display:flex; flex-direction:column; background:var(--bg-main); position:relative; }

@media (max-width:768px) {
  .sidebar { width:100%; border-right:none; }
  .sidebar.hidden-mobile { display:none; }
  .main-area { position:absolute; inset:0; display:none; }
  .main-area.active { display:flex; }
}

/* Sidebar header */
.sidebar-header { background:var(--bg-header); color:var(--text-header); padding:12px 16px;
  display:flex; align-items:center; gap:12px; min-height:60px; }
.avatar { width:40px; height:40px; border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:16px; }
.avatar.lg { width:64px; height:64px; font-size:26px; }
.sidebar-header .info { flex:1; min-width:0; }
.sidebar-header .info .name { font-weight:600; font-size:15px; }
.sidebar-header .info .status { font-size:11px; opacity:.8; margin-top:1px; }
.sidebar-header button { background:none; border:none; color:inherit; font-size:20px; cursor:pointer;
  padding:8px; border-radius:50%; }
.sidebar-header button:hover { background:rgba(255,255,255,.12); }

/* Chat list */
.chat-list { flex:1; overflow-y:auto; }
.chat-item { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer;
  border-bottom:1px solid var(--border); }
.chat-item:hover { background:var(--hover); }
.chat-item.active { background:var(--hover); }
.chat-item .body { flex:1; min-width:0; }
.chat-item .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.chat-item .name { font-weight:600; color:var(--text-primary); font-size:15px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-item .time { font-size:11px; color:var(--text-secondary); flex-shrink:0; }
.chat-item .preview { font-size:13px; color:var(--text-secondary); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.chat-item .unread { background:var(--green); color:#fff; font-size:11px; font-weight:600;
  border-radius:10px; padding:2px 7px; flex-shrink:0; }
.avatar-wrap { position:relative; }
.online-dot { position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%;
  background:var(--green); border:2px solid var(--bg-sidebar); }
.empty-state { padding:40px 24px; text-align:center; color:var(--text-secondary); font-size:14px; line-height:1.7; }
.empty-state code { background:var(--bg-main); padding:2px 6px; border-radius:4px; font-size:12px; }

/* Chat */
.chat-header { background:var(--bg-header); color:var(--text-header); padding:10px 16px;
  display:flex; align-items:center; gap:12px; min-height:60px; flex-shrink:0; }
.chat-header .back { background:none; border:none; color:inherit; font-size:22px; cursor:pointer;
  padding:4px; margin-right:4px; display:none; }
@media (max-width:768px) { .chat-header .back { display:block; } }
.chat-header .info { flex:1; min-width:0; }
.chat-header .info .name { font-weight:600; font-size:15px; }
.chat-header .info .status { font-size:11px; opacity:.8; }
.chat-header .actions { display:flex; gap:6px; }
.chat-header .actions button { background:none; border:none; color:inherit; font-size:20px;
  cursor:pointer; padding:8px; border-radius:50%; }
.chat-header .actions button:hover { background:rgba(255,255,255,.12); }

.messages-wrap { background:var(--bg-chat); flex:1; display:flex; flex-direction:column; overflow:hidden; }
.messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:3px; }
.messages::-webkit-scrollbar { width:8px; }
.messages::-webkit-scrollbar-thumb { background:rgba(0,0,0,.2); border-radius:4px; }

.bubble { max-width:75%; padding:6px 10px 8px; border-radius:8px; position:relative;
  word-wrap:break-word; box-shadow:0 1px 1px rgba(0,0,0,.05); color:var(--text-primary); }
.bubble.mine { background:var(--bg-bubble-out); align-self:flex-end; }
.bubble.theirs { background:var(--bg-bubble-in); align-self:flex-start; }
.bubble .text { font-size:14.5px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
.bubble .meta { font-size:10.5px; color:var(--text-secondary); margin-top:3px;
  display:flex; justify-content:flex-end; align-items:center; gap:4px; }
.bubble .meta .check { color:var(--blue-check); }
.bubble .reply-quote { font-size:12px; color:var(--text-secondary); border-left:3px solid var(--green);
  padding-left:6px; margin-bottom:4px; }
.bubble .img { max-width:280px; max-height:300px; border-radius:6px; display:block; cursor:pointer; }
.bubble .audio { width:240px; margin:4px 0; }
.bubble .file { display:flex; gap:8px; align-items:center; padding:8px; background:rgba(0,0,0,.04);
  border-radius:6px; text-decoration:none; color:var(--text-primary); }
.bubble .file-name { font-size:13px; font-weight:500; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:180px; }
.bubble .file-size { font-size:11px; color:var(--text-secondary); }
.bubble.deleted { font-style:italic; opacity:.6; }
.typing { padding:6px 16px; font-size:12px; color:var(--text-secondary); font-style:italic; }

/* Composer */
.composer { background:var(--bg-header); padding:8px 10px; display:flex; gap:6px; align-items:flex-end;
  min-height:60px; flex-shrink:0; }
.composer button.icon-btn { background:none; border:none; color:var(--text-header); font-size:22px;
  cursor:pointer; padding:8px; border-radius:50%; flex-shrink:0; }
.composer button.icon-btn:hover { background:rgba(255,255,255,.1); }
.composer textarea { flex:1; border:none; border-radius:8px; padding:10px 14px; font-size:14.5px;
  resize:none; outline:none; background:var(--bg-input); color:var(--text-primary);
  max-height:120px; min-height:40px; font-family:inherit; line-height:1.4; }
.composer .send-btn { background:var(--green); color:#fff; border:none; width:40px; height:40px;
  border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; }
.composer .send-btn:hover { background:var(--green-dark); }

.recording-bar { background:var(--red); color:#fff; padding:10px 16px; display:flex;
  align-items:center; gap:12px; flex-shrink:0; }
.recording-bar .dot { width:10px; height:10px; background:#fff; border-radius:50%;
  animation:pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.recording-bar button { background:rgba(255,255,255,.2); border:none; color:#fff;
  padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; }
.recording-bar button:hover { background:rgba(255,255,255,.3); }

/* Empty chat */
.empty-chat { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-main); color:var(--text-secondary); text-align:center; padding:40px; }
.empty-chat h2 { font-size:42px; color:var(--green-dark); font-weight:800; margin-bottom:8px; }
[data-theme="dark"] .empty-chat h2 { color:var(--green); }
.empty-chat p { font-size:14px; }
.empty-chat .sub { margin-top:16px; font-size:12px; opacity:.6; max-width:320px; }

/* Modal */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
  align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal { background:var(--bg-sidebar); border-radius:12px; padding:24px; max-width:420px; width:100%;
  max-height:90vh; overflow-y:auto; }
.modal h2 { font-size:20px; margin-bottom:16px; color:var(--text-primary); }
.modal label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
.modal input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg-main); color:var(--text-primary); font-size:14px; outline:none; margin-bottom:14px; }
.modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal button { padding:10px 20px; border-radius:8px; border:none; cursor:pointer;
  font-size:14px; font-weight:500; }
.modal button.primary { background:var(--green); color:#fff; }
.modal button.primary:hover { background:var(--green-dark); }
.modal button.secondary { background:var(--bg-main); color:var(--text-primary); }
.modal button.danger { background:var(--red); color:#fff; }
.modal .menu-item { display:block; width:100%; text-align:left; padding:14px; font-size:15px;
  color:var(--text-primary); background:none; border-radius:8px; margin-bottom:2px; }
.modal .menu-item:hover { background:var(--hover); }
.modal code { background:var(--bg-main); padding:2px 6px; border-radius:4px; font-size:12px; }

/* Calls */
.call-modal { position:fixed; inset:0; background:#000; z-index:200; display:flex; flex-direction:column; }
.call-modal video { flex:1; object-fit:cover; background:#000; width:100%; }
.call-modal .remote-video { flex:1; background:#111; display:flex; align-items:center;
  justify-content:center; color:#fff; font-size:15px; }
.call-controls { padding:24px; display:flex; gap:14px; justify-content:center; background:#1a1a1a; }
.call-controls button { width:56px; height:56px; border-radius:50%; border:none; font-size:24px;
  cursor:pointer; color:#fff; background:#333; }
.call-controls button.end { background:var(--red); }
.call-controls button:hover { opacity:.85; }
.call-info { position:absolute; top:24px; left:0; right:0; color:#fff; text-align:center; z-index:10; }
.call-info .call-name { font-size:22px; font-weight:600; }
.call-info .call-dur { font-size:14px; opacity:.85; margin-top:6px; }
.local-video-pip { position:absolute; top:20px; right:20px; width:130px; height:170px;
  border-radius:8px; object-fit:cover; background:#333; z-index:5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* =========================================================
   STATE
   ========================================================= */
const state = {
  me: null,
  peers: {},
  chats: {},
  activePeer: null,
  unread: {},
  typing: {},
  draft: {},
  theme: localStorage.getItem('youlanchat-theme') || 'light',
  recording: false,
  recordSecs: 0,
  replyTo: null,
  showSettings: false,
  showMenuFor: null,
  call: null,
  incomingCall: null,
};
document.documentElement.setAttribute('data-theme', state.theme);

/* =========================================================
   STORAGE
   ========================================================= */
const LS_IDS = 'youlanchat-identities';
const LS_SESSION = 'youlanchat-session';
const LS_CHATS = id => `youlanchat-chats-${id}`;

function getIdentities() {
  try { return JSON.parse(localStorage.getItem(LS_IDS) || '[]'); } catch { return []; }
}
function saveIdentities(list) {
  localStorage.setItem(LS_IDS, JSON.stringify(list));
}
function getSessionId() { return sessionStorage.getItem(LS_SESSION); }
function setSessionId(id) { sessionStorage.setItem(LS_SESSION, id); }
function getMyIdentity() {
  const id = getSessionId();
  if (!id) return null;
  return getIdentities().find(x => x.id === id) || null;
}
function createIdentity(name) {
  const id = 'dev-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  const list = getIdentities();
  list.push({ id, name, createdAt: Date.now() });
  saveIdentities(list);
  setSessionId(id);
  localStorage.setItem(LS_CHATS(id), '{}');
  return { id, name };
}
function loadChats(id) {
  try { return JSON.parse(localStorage.getItem(LS_CHATS(id)) || '{}'); } catch { return {}; }
}
function saveChats() {
  if (!state.me) return;
  try { localStorage.setItem(LS_CHATS(state.me.id), JSON.stringify(state.chats)); }
  catch (e) { console.warn('Storage full — chat not persisted:', e); }
}

/* =========================================================
   BROADCAST (LAN SIMULATION)
   ========================================================= */
let bc = null;
try { bc = new BroadcastChannel('youlanchat'); } catch (e) { console.warn('BroadcastChannel unavailable'); }

function broadcast(msg) {
  if (bc) bc.postMessage(msg);
}
function announce() {
  if (state.me) broadcast({ type: 'hello', from: state.me.id, name: state.me.name });
}

function handleBroadcast(e) {
  const m = e.data;
  if (!state.me || !m || !m.from || m.from === state.me.id) return;

  switch (m.type) {
    case 'hello': {
      const isNew = !state.peers[m.from];
      if (isNew) {
        state.peers[m.from] = { id: m.from, name: m.name, online: true, lastSeen: Date.now() };
        announce();
        render();
      } else {
        state.peers[m.from].name = m.name;
        state.peers[m.from].online = true;
        state.peers[m.from].lastSeen = Date.now();
        render();
      }
      break;
    }
    case 'bye': {
      if (state.peers[m.from]) {
        state.peers[m.from].online = false;
        state.peers[m.from].lastSeen = Date.now();
        render();
      }
      break;
    }
    case 'message': {
      const chat = state.chats[m.from] || (state.chats[m.from] = []);
      chat.push(m.message);
      if (state.activePeer !== m.from) {
        state.unread[m.from] = (state.unread[m.from] || 0) + 1;
      } else {
        broadcast({ type: 'read', from: state.me.id, to: m.from, ids: [m.message.id] });
      }
      saveChats();
      render();
      break;
    }
    case 'typing': {
      state.typing[m.from] = !!m.state;
      render();
      break;
    }
    case 'read': {
      const chat = state.chats[m.from] || [];
      let changed = false;
      for (const msg of chat) {
        if (m.ids.includes(msg.id) && msg.from === state.me.id && msg.status !== 'read') {
          msg.status = 'read';
          changed = true;
        }
      }
      if (changed) { saveChats(); render(); }
      break;
    }
    case 'delivered': {
      const chat = state.chats[m.from] || [];
      let changed = false;
      for (const msg of chat) {
        if (m.ids.includes(msg.id) && msg.from === state.me.id && msg.status === 'sent') {
          msg.status = 'delivered';
          changed = true;
        }
      }
      if (changed) { saveChats(); render(); }
      break;
    }
    case 'delete': {
      const chat = state.chats[m.from] || [];
      state.chats[m.from] = chat.map(x => x.id === m.id
        ? { ...x, deleted: true, text: null, dataUrl: null, name: null } : x);
      saveChats(); render();
      break;
    }
    case 'call-offer': {
      if (state.call) {
        broadcast({ type: 'call-end', from: state.me.id, to: m.from });
        return;
      }
      state.incomingCall = { peerId: m.from, type: m.callType, sdp: m.sdp };
      render();
      break;
    }
    case 'call-answer': {
      if (state.call?.peerId === m.from && state.call.pc) {
        state.call.pc.setRemoteDescription(new RTCSessionDescription(m.sdp)).catch(console.error);
      }
      break;
    }
    case 'call-ice': {
      if (state.call?.peerId === m.from && state.call.pc) {
        state.call.pc.addIceCandidate(new RTCIceCandidate(m.candidate)).catch(console.error);
      }
      break;
    }
    case 'call-end': {
      if (state.call?.peerId === m.from) endCall(false);
      if (state.incomingCall?.peerId === m.from) { state.incomingCall = null; render(); }
      break;
    }
  }
}
if (bc) bc.addEventListener('message', handleBroadcast);

/* =========================================================
   MESSAGING
   ========================================================= */
function sendMessage(peerId, content) {
  if (!peerId || !state.me) return;
  const msg = {
    id: 'msg-' + Math.random().toString(36).slice(2, 12),
    from: state.me.id,
    to: peerId,
    createdAt: Date.now(),
    status: 'sent',
    replyTo: state.replyTo ? { id: state.replyTo.id, text: previewOf(state.replyTo) } : null,
    ...content,
  };
  const chat = state.chats[peerId] || (state.chats[peerId] = []);
  chat.push(msg);
  state.replyTo = null;
  saveChats();
  broadcast({ type: 'message', from: state.me.id, message: msg });
  setTimeout(() => {
    if (msg.status === 'sent') {
      msg.status = 'delivered';
      saveChats(); render();
    }
  }, 250);
  render();
}

function previewOf(msg) {
  if (!msg) return '';
  if (msg.deleted) return 'Deleted message';
  if (msg.kind === 'text') return msg.text?.slice(0, 60) || '';
  if (msg.kind === 'image') return '📷 Photo';
  if (msg.kind === 'video') return '🎥 Video';
  if (msg.kind === 'voice') return '🎤 Voice note';
  if (msg.kind === 'audio') return '🎵 Audio';
  if (msg.kind === 'file') return '📄 ' + (msg.name || 'File');
  return '';
}

let typingTimeout;
function sendTyping(isTyping) {
  if (!state.activePeer) return;
  broadcast({ type: 'typing', from: state.me.id, state: isTyping });
}
function onComposerInput() {
  const ta = document.querySelector('#composer-text');
  if (!ta || !state.activePeer) return;
  state.draft[state.activePeer] = ta.value;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  sendTyping(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => sendTyping(false), 1500);
  updateSendButton();
}
function updateSendButton() {
  const btn = document.querySelector('#send-btn');
  if (!btn || !state.activePeer) return;
  const hasText = (state.draft[state.activePeer] || '').trim().length > 0;
  if (hasText) {
    btn.textContent = '➤';
    btn.className = 'send-btn';
    btn.dataset.action = 'send';
  } else {
    btn.textContent = '🎤';
    btn.className = 'icon-btn';
    btn.dataset.action = 'record';
  }
}
function onComposerKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMessage(); }
}
function sendTextMessage() {
  const ta = document.querySelector('#composer-text');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || !state.activePeer) return;
  state.draft[state.activePeer] = '';
  sendMessage(state.activePeer, { kind: 'text', text });
  requestAnimationFrame(() => {
    const n = document.querySelector('#composer-text');
    if (n) { n.focus(); n.style.height = '40px'; }
    updateSendButton();
  });
}

/* =========================================================
   VOICE RECORDING
   ========================================================= */
let mediaRecorder = null;
let recordChunks = [];
let recordStartTs = 0;
let recordTimer = null;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recordChunks = [];
    recordStartTs = Date.now();
    mediaRecorder.ondataavailable = e => e.data.size && recordChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimer);
      state.recording = false;
      if (recordChunks.length === 0) { render(); return; }
      const blob = new Blob(recordChunks, { type: 'audio/webm' });
      const dataUrl = await blobToDataUrl(blob);
      const duration = Math.round((Date.now() - recordStartTs) / 1000);
      const peer = state.activePeer;
      state.recordSecs = 0;
      if (peer) sendMessage(peer, { kind: 'voice', dataUrl, duration });
      else render();
    };
    mediaRecorder.start();
    state.recording = true;
    state.recordSecs = 0;
    recordTimer = setInterval(() => {
      state.recordSecs = Math.round((Date.now() - recordStartTs) / 1000);
      const el = document.querySelector('#recording-secs');
      if (el) el.textContent = state.recordSecs + 's';
    }, 200);
    render();
  } catch (e) {
    alert('Microphone access denied: ' + e.message);
  }
}
function stopRecording(send) {
  if (!mediaRecorder) return;
  if (!send) {
    recordChunks = [];
    mediaRecorder.onstop = () => {
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimer);
      state.recording = false;
      render();
    };
  }
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}
function blobToDataUrl(blob) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(blob);
  });
}

/* =========================================================
   FILE SHARING
   ========================================================= */
async function onFileSelect(e) {
  const files = Array.from(e.target.files || []);
  const peer = state.activePeer;
  e.target.value = '';
  if (!peer) return;
  for (const file of files) {
    if (file.size > 8 * 1024 * 1024) {
      alert(`File too large for single-file demo (${file.name}). Max 8MB.`);
      continue;
    }
    const dataUrl = await fileToDataUrl(file);
    let kind = 'file';
    if (file.type.startsWith('image/')) kind = 'image';
    else if (file.type.startsWith('video/')) kind = 'video';
    else if (file.type.startsWith('audio/')) kind = 'audio';
    sendMessage(peer, { kind, name: file.name, mime: file.type, size: file.size, dataUrl });
  }
}
function fileToDataUrl(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

/* =========================================================
   WEBRTC CALLS
   ========================================================= */
const RTC_CFG = { iceServers: [] }; // Pure LAN — host candidates suffice

async function startCall(type) {
  if (!state.activePeer || state.call) return;
  const peerId = state.activePeer;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: type === 'video',
    });
    const pc = new RTCPeerConnection(RTC_CFG);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const call = {
      peerId, type, stream, pc, startedAt: Date.now(),
      state: 'calling', muted: false, cameraOff: false, remoteStream: null,
    };
    state.call = call;

    pc.onicecandidate = e => {
      if (e.candidate) broadcast({ type: 'call-ice', from: state.me.id, candidate: e.candidate });
    };
    pc.ontrack = e => {
      call.remoteStream = e.streams[0];
      const rv = document.querySelector('#remote-video');
      if (rv) rv.srcObject = e.streams[0];
      else render();
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') { call.state = 'connected'; render(); }
      if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
        endCall(false);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    broadcast({
      type: 'call-offer', from: state.me.id, callType: type,
      sdp: { type: offer.type, sdp: offer.sdp },
    });
    render();
  } catch (e) {
    alert('Cannot start call: ' + e.message);
  }
}

async function acceptCall() {
  const inc = state.incomingCall;
  if (!inc) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true, video: inc.type === 'video',
    });
    const pc = new RTCPeerConnection(RTC_CFG);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const call = {
      peerId: inc.peerId, type: inc.type, stream, pc, startedAt: Date.now(),
      state: 'connected', muted: false, cameraOff: false, remoteStream: null,
    };
    state.call = call;
    state.incomingCall = null;

    pc.onicecandidate = e => {
      if (e.candidate) broadcast({ type: 'call-ice', from: state.me.id, candidate: e.candidate });
    };
    pc.ontrack = e => {
      call.remoteStream = e.streams[0];
      const rv = document.querySelector('#remote-video');
      if (rv) rv.srcObject = e.streams[0];
    };

    await pc.setRemoteDescription(new RTCSessionDescription(inc.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    broadcast({
      type: 'call-answer', from: state.me.id,
      sdp: { type: answer.type, sdp: answer.sdp },
    });
    render();
  } catch (e) {
    alert('Cannot accept call: ' + e.message);
    state.incomingCall = null;
    render();
  }
}
function rejectCall() {
  if (!state.incomingCall) return;
  broadcast({ type: 'call-end', from: state.me.id, to: state.incomingCall.peerId });
  state.incomingCall = null;
  render();
}
function endCall(notify = true) {
  if (!state.call) return;
  const c = state.call;
  if (notify) broadcast({ type: 'call-end', from: state.me.id, to: c.peerId });
  c.stream?.getTracks().forEach(t => t.stop());
  try { c.pc?.close(); } catch {}
  state.call = null;
  render();
}
function toggleMute() {
  if (!state.call) return;
  state.call.muted = !state.call.muted;
  state.call.stream.getAudioTracks().forEach(t => t.enabled = !state.call.muted);
  render();
}
function toggleCamera() {
  if (!state.call) return;
  state.call.cameraOff = !state.call.cameraOff;
  state.call.stream.getVideoTracks().forEach(t => t.enabled = !state.call.cameraOff);
  render();
}

function renderBubble(msg) {
  const mine = msg.from === state.me.id;
  const cls = mine ? 'mine' : 'theirs';
  let content = '';
  if (msg.deleted) {
    content = `<div class="text deleted">🚫 This message was deleted</div>`;
  } else if (msg.kind === 'text') {
    content = `<div class="text">${esc(msg.text)}</div>`;
  } else if (msg.kind === 'image') {
    content = `<img class="img" src="${msg.dataUrl}" alt="image" onclick="window.open('${msg.dataUrl}','_blank')">`;
  } else if (msg.kind === 'video') {
    content = `<video class="img" src="${msg.dataUrl}" controls></video>`;
  } else if (msg.kind === 'audio') {
    content = `<audio class="audio" src="${msg.dataUrl}" controls></audio>`;
  } else if (msg.kind === 'voice') {
    content = `<div style="display:flex;align-items:center;gap:8px;">
      <audio class="audio" src="${msg.dataUrl}" controls></audio>
      <span style="font-size:11px;color:var(--text-secondary)">${msg.duration || 0}s</span>
    </div>`;
  } else if (msg.kind === 'file') {
    content = `<a class="file" href="${msg.dataUrl}" download="${esc(msg.name)}">
      📄 <div>
        <div class="file-name">${esc(msg.name)}</div>
        <div class="file-size">${fmtSize(msg.size)}</div>
      </div>
    </a>`;
  }
  const reply = msg.replyTo ? `<div class="reply-quote">↪ ${esc(msg.replyTo.text)}</div>` : '';
  const check = mine && !msg.deleted ? checkIcon(msg.status) : '';
  return `
    <div class="bubble ${cls}" data-msg-id="${msg.id}" data-msg-from="${msg.from}">
      ${reply}${content}
      <div class="meta"><span>${fmtTime(msg.createdAt)}</span>${check}</div>
    </div>
  `;
}
function checkIcon(status) {
  if (status === 'read') return '<span class="check">✓✓</span>';
  if (status === 'delivered') return '<span>✓✓</span>';
  return '<span>✓</span>';
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  switch (el.dataset.action) {
    case 'select-peer': {
      const id = el.dataset.id;
      state.activePeer = id;
      state.unread[id] = 0;
      const chat = state.chats[id] || [];
      const unreadIds = chat.filter(m => m.from === id && m.status !== 'read').map(m => m.id);
      if (unreadIds.length) broadcast({ type: 'read', from: state.me.id, to: id, ids: unreadIds });
      state.typing[id] = false;
      render();
      break;
    }
    case 'back': state.activePeer = null; render(); break;
    case 'send': sendTextMessage(); break;
    case 'record': startRecording(); break;
    case 'stop-record': stopRecording(true); break;
    case 'cancel-record': stopRecording(false); break;
    case 'attach': document.querySelector('#file-input')?.click(); break;
    case 'toggle-theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('youlanchat-theme', state.theme);
      document.documentElement.setAttribute('data-theme', state.theme);
      render();
      break;
    }
    case 'open-settings': state.showSettings = true; render(); break;
    case 'close-settings':
    case 'close-settings-bg': state.showSettings = false; render(); break;
    case 'save-settings': {
      const name = document.getElementById('settings-name')?.value.trim();
      if (name) {
        state.me.name = name;
        const list = getIdentities();
        const idx = list.findIndex(x => x.id === state.me.id);
        if (idx >= 0) { list[idx].name = name; saveIdentities(list); }
        announce();
      }
      state.showSettings = false;
      render();
      break;
    }
    case 'audio-call': startCall('audio'); break;
    case 'video-call': startCall('video'); break;
    case 'accept-call': acceptCall(); break;
    case 'reject-call': rejectCall(); break;
    case 'end-call': endCall(); break;
    case 'toggle-mute': toggleMute(); break;
    case 'toggle-camera': toggleCamera(); break;
    case 'close-menu':
    case 'close-menu-bg': state.showMenuFor = null; render(); break;
    case 'reply-msg': {
      const msg = findMessage(state.showMenuFor);
      if (msg) state.replyTo = msg;
      state.showMenuFor = null;
      render();
      const ta = document.querySelector('#composer-text');
      if (ta) ta.focus();
      break;
    }
    case 'delete-msg-me': {
      const peerId = state.activePeer;
      const id = state.showMenuFor;
      if (peerId && id) {
        state.chats[peerId] = (state.chats[peerId] || []).filter(m => m.id !== id);
        saveChats();
      }
      state.showMenuFor = null;
      render();
      break;
    }
    case 'delete-msg-all': {
      const peerId = state.activePeer;
      const id = state.showMenuFor;
      if (peerId && id) {
        state.chats[peerId] = (state.chats[peerId] || []).map(m =>
          m.id === id ? { ...m, deleted: true, text: null, dataUrl: null, name: null } : m
        );
        saveChats();
        broadcast({ type: 'delete', from: state.me.id, id });
      }
      state.showMenuFor = null;
      render();
      break;
    }
  }
});

/* Long-press / right-click → message menu */
let pressTimer = null;
document.addEventListener('touchstart', e => {
  const b = e.target.closest('.bubble');
  if (!b) return;
  pressTimer = setTimeout(() => {
    state.showMenuFor = b.dataset.msgId;
    render();
  }, 550);
}, { passive: true });
['touchend','touchmove','touchcancel'].forEach(ev =>
  document.addEventListener(ev, () => clearTimeout(pressTimer)));
document.addEventListener('contextmenu', e => {
  const b = e.target.closest('.bubble');
  if (!b) return;
  e.preventDefault();
  state.showMenuFor = b.dataset.msgId;
  render();
});

/* Find message helper */
function findMessage(id) {
  if (!id) return null;
  for (const peerId in state.chats) {
    const m = state.chats[peerId].find(x => x.id === id);
    if (m) return m;
  }
  return null;
}

/* =========================================================
   UTILITIES
   ========================================================= */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
function fmtTime(ts) {
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

/* =========================================================
   INIT
   ========================================================= */
(function init() {
  const id = getSessionId();
  if (id) {
    const me = getMyIdentity();
    if (me) { state.me = me; state.chats = loadChats(me.id); }
  }
  if (state.me) announce();

  window.addEventListener('beforeunload', () => {
    if (state.me) broadcast({ type: 'bye', from: state.me.id });
  });

  setInterval(() => { if (state.me) announce(); }, 5000);

  setInterval(() => {
    const now = Date.now();
    let changed = false;
    for (const id in state.peers) {
      if (state.peers[id].online && now - state.peers[id].lastSeen > 15000) {
        state.peers[id].online = false;
        changed = true;
      }
    }
    if (changed) render();
  }, 5000);

  setInterval(() => {
    const el = document.querySelector('#call-dur');
    if (el && state.call?.state === 'connected') {
      const secs = Math.floor((Date.now() - state.call.startedAt) / 1000);
      el.textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    }
  }, 1000);

  render();
})();
</script>
